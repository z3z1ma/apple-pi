}
[data-theme="dark"] {

  --att-high: #ff8a4c; --att-medium: #f5c04a; --att-low: #6b6a66;
  --k-change: #ff8a4c; --k-question: #5aa9ff; --k-concern: #f5c04a; --k-nit: #8b8984; --k-praise: #57d377;

}
* { box-sizing: border-box; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 13px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 500; font-size: 13px; cursor: pointer; transition: background .15s, transform .1s; white-space: nowrap; }

.att-dot.att-high { background: var(--att-high); } .att-dot.att-medium { background: var(--att-medium); }
.att-pill { display: inline-flex; align-items: center; gap: 6px; font: 600 11px var(--font-ui); letter-spacing: .02em; padding: 2px 8px 2px 7px; border-radius: 99px; color: var(--att-low); background: color-mix(in srgb, var(--att-low) 14%, transparent); text-transform: none; }

.att-bars.att-low i:nth-child(1) { background: var(--att-low); }
.att-bars.att-medium i:nth-child(-n+2) { background: var(--att-medium); }
.att-bars.att-high i { background: var(--att-high); }
.a-high { --a: var(--att-high); } .a-medium { --a: var(--att-medium); } .a-low { --a: var(--att-low); }

/* inline blocks in the diff */
.inl { margin: 6px 18px 8px 102px; font: 13.5px/1.55 var(--font-ui); }
.note-c { display: flex; align-items: center; gap: 8px; width: calc(100% - 120px); height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--agent-line); background: var(--agent-bg); color: var(--ink-2); cursor: pointer; text-align: left; font-size: 12.5px; }

.note-c-more { color: var(--agent); font-weight: 600; font-size: 12px; }
.note { padding: 10px 14px 10px 13px; border-radius: 10px; background: var(--agent-bg); border: 1px solid var(--agent-line); }
.note-h, .cmt-h { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-3); margin-bottom: 3px; }
.note-h .who { color: var(--agent); font-weight: 600; }

.replies { margin-top: 10px; display: grid; gap: 8px; }

.note-actions { margin-top: 6px; display: flex; gap: 14px; }
.cmt { padding: 10px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line-2); border-left: 3px solid var(--k); box-shadow: var(--shadow); }
.cmt-h .who { color: var(--ink); font-weight: 600; }
.kind { font-weight: 600; font-size: 11px; letter-spacing: .02em; color: var(--k); }
.k-question { --k: var(--k-question); } .k-change { --k: var(--k-change); } .k-concern { --k: var(--k-concern); } .k-nit { --k: var(--k-nit); } .k-praise { --k: var(--k-praise); }
.where { font-family: var(--font-mono); font-size: 11.5px; }
.av { width: 18px; height: 18px; border-radius: 50%; background: var(--ink); color: var(--bg); font: 700 10px/18px var(--font-ui); text-align: center; flex: none; }
.composer { padding: 12px; border-radius: 12px; background: var(--surface); border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line-2)); box-shadow: 0 0 0 4px var(--accent-bg), var(--shadow); }
.composer.ask { border-color: color-mix(in srgb, var(--agent) 50%, var(--line-2)); box-shadow: 0 0 0 4px var(--agent-bg), var(--shadow); }
.composer-top { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 10px; }
.composer-top b { font-weight: 600; color: var(--ink); }
.composer-top .kbd-hint { margin-left: auto; }
.seg { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--surface-3); }
.seg button { border: 0; background: transparent; height: 26px; padding: 0 10px; border-radius: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink-3); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.seg button .ic { width: 13px; height: 13px; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.composer.ask .seg button.on { color: var(--agent); }
.kinds { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.kind-chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 99px; border: 1px solid var(--line-2); background: transparent; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
.kind-chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--k); }
.kind-chip.on { border-color: var(--k); color: var(--ink); background: color-mix(in srgb, var(--k) 10%, transparent); }
textarea { width: 100%; resize: vertical; border: 1px solid var(--line-2); border-radius: 9px; background: var(--surface-2); color: var(--ink); font: 14px/1.5 var(--font-ui); padding: 9px 11px; outline: none; transition: border-color .15s, box-shadow .15s; }
textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); background: var(--surface); }
.composer-foot, .vd-foot { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.ask-t { border-radius: 12px; border: 1px solid var(--agent-line); background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
.ask-q { display: flex; gap: 9px; align-items: flex-start; padding: 10px 14px; border-bottom: 1px solid var(--agent-line); }
.ask-q .where { margin-left: auto; color: var(--ink-3); white-space: nowrap; }
.ask-a { display: flex; gap: 9px; padding: 11px 14px; background: var(--agent-bg); }
.ask-a > .ic { color: var(--agent); margin-top: 3px; width: 14px; height: 14px; }
.ask-a p { margin: 0 0 8px; } .ask-a p:last-child { margin: 0; }
.ask-actions { display: flex; align-items: center; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--agent-line); background: var(--agent-bg); }
.sim-tag { font: 600 10.5px var(--font-ui); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); }
.thinking { color: var(--ink-3); display: inline-flex; align-items: center; gap: 8px; }
.dots { display: inline-flex; gap: 3px; } .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--agent); animation: blink 1s infinite; } .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 50% { opacity: .2; } }
.dec-c { display: flex; align-items: center; gap: 9px; width: calc(100% - 120px); min-height: 32px; padding: 4px 12px; border-radius: 8px; border: 1px solid var(--agent-line); background: var(--surface); cursor: pointer; text-align: left; font-size: 13px; }
.dec-c.q { border-color: color-mix(in srgb, var(--k-question) 45%, var(--line)); background: color-mix(in srgb, var(--k-question) 5%, var(--surface)); }
.dec-c .di { color: var(--agent); font-size: 12px; }
.dec-c.q .di, .dec-c.q .dec-c-k { color: var(--k-question); }
.dec-c-k { font: 600 11px var(--font-ui); letter-spacing: .04em; text-transform: uppercase; color: var(--agent); white-space: nowrap; }
.dec-c-t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 550; }
.dec-c-a { color: var(--ink-3); white-space: nowrap; font-size: 12.5px; }
.dec-c-a b { color: var(--ink); font-weight: 600; }

/* ---------- shared blocks ---------- */
.callout { display: flex; gap: 12px; padding: 12px 16px; border-radius: 12px; background: color-mix(in srgb, var(--att-medium) 9%, var(--surface)); border: 1px solid color-mix(in srgb, var(--att-medium) 30%, var(--line)); }
.callout .co-ic { color: var(--att-medium); padding-top: 2px; }
.co-t { font: 600 12px var(--font-ui); letter-spacing: .03em; text-transform: uppercase; color: var(--att-medium); margin-bottom: 2px; }
.co-b { font-size: 14px; line-height: 1.6; }
.decision { padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.decision.open { border-color: color-mix(in srgb, var(--k-question) 40%, var(--line)); }
.dec-h { display: flex; align-items: center; gap: 7px; font: 600 11.5px var(--font-ui); letter-spacing: .04em; text-transform: uppercase; color: var(--agent); margin-bottom: 6px; }
.decision.open .dec-h { color: var(--k-question); }
.dec-h .ic { width: 14px; height: 14px; }
.dec-h .link { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; }
.dec-q { font: 600 15px/1.4 var(--font-ui); margin-bottom: 2px; }
.dec-ctx { margin: 0 0 10px; color: var(--ink-2); font-size: 13.5px; }
.dec-opts { display: grid; gap: 6px; }
.dec-opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; }
.dec-opt:hover { background: var(--surface-3); }
.dec-opt .radio { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--ink-4); margin-top: 2px; flex: none; }
.dec-opt.on { border-color: var(--accent); background: var(--accent-bg); }
.dec-opt.on .radio { border: 5px solid var(--accent); }
.dec-body { display: grid; gap: 2px; }
.dec-label { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.dec-detail { color: var(--ink-2); font-size: 13px; }
.tag-agent { font: 600 10.5px var(--font-ui); color: var(--agent); background: var(--agent-bg); border: 1px solid var(--agent-line); padding: 1px 7px; border-radius: 99px; }
.dec-note { margin-top: 10px; font-size: 13.5px; }
.verif { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.verif li { display: grid; grid-template-columns: 16px 1fr; gap: 10px; font-size: 13.5px; line-height: 1.5; }
.verif .v-ic { padding-top: 2px; }
.verif .ic { width: 15px; height: 15px; }
.v-pass .v-ic { color: var(--pass); } .v-fail .v-ic { color: var(--fail); } .v-unverified .v-ic { color: var(--unverified); }
.v-l { font-weight: 500; } .v-d { color: var(--ink-3); font-size: 12.5px; margin-left: 6px; }
.verdict { display: grid; gap: 14px; }
.vd-stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ink-3); }
.vd-stats b { color: var(--ink); font-weight: 600; }
.vd-stats .warn { color: var(--att-medium); }
.vd-opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.vd-opt { display: grid; gap: 3px; text-align: left; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; }
.vd-opt:hover { background: var(--surface-3); }
.vd-l { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.vd-l::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--vc); }
.vd-d { color: var(--ink-3); font-size: 12.5px; }
.vd-approve { --vc: var(--pass); } .vd-approve_notes { --vc: var(--att-medium); } .vd-changes { --vc: var(--k-change); }
.vd-opt.on { border-color: var(--vc); background: color-mix(in srgb, var(--vc) 9%, var(--surface)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--vc) 14%, transparent); }

/* ---------- overlays ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 55%, transparent); backdrop-filter: blur(6px); animation: fade .18s var(--ease); }
.modal { width: min(760px, calc(100vw - 48px)); max-height: calc(100vh - 96px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow-lg); padding: 22px 24px 24px; animation: rise .22s var(--ease); }
.modal-h { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }

.modal-sub { color: var(--ink-3); font-size: 13px; margin: -8px 0 14px; }
.sim { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--surface-3); color: var(--ink-2); font-size: 13px; margin-bottom: 12px; }
pre.json { margin: 0; padding: 14px 16px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); font: 12px/1.6 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.j-k { color: var(--tk-p); } .j-s { color: var(--tk-s); } .j-n { color: var(--tk-n); } .j-b { color: var(--tk-k); }
.keys { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 28px; }

@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.985); } }

/* ---------- prototype bar (not part of the design) ---------- */
.proto-bar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 100; display: flex; align-items: center; gap: 4px; padding: 5px 6px 5px 12px; border-radius: 99px; background: #111; color: #f2f2f2; box-shadow: 0 8px 30px rgba(0, 0, 0, .35), 0 0 0 1px #2a2a2a; font: 12.5px var(--font-ui); }
.proto-bar button { border: 0; background: transparent; color: #cfcfcf; height: 28px; min-width: 28px; padding: 0 10px; border-radius: 99px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.proto-bar button:hover { background: #2a2a2a; color: #fff; }

The billing sync fails a few times a day when the upstream API sheds load. This spec adds retries to \`HttpClient\` for responses that are safe and useful to retry, without hiding real errors.

## Goals

- Recover from 429, 502, 503 and 504 without the caller noticing.
- Follow \`Retry-After\` when the server sends it.
- Never repeat a request that is unsafe to repeat.

## Non-goals

Circuit breaking, request hedging, and retries for streaming bodies are out of scope. They need their own design.

## Behaviour

\`\`\`mermaid
flowchart LR
  A[Send request] --> B{Response ok?}
  B -- yes --> Z[Return response]
  B -- no --> C{Retryable and idempotent?}
  C -- no --> E[Throw HttpError]
  C -- yes --> D{Budget left?}
  D -- no --> E
  D -- yes --> W[Wait with jitter] --> A
\`\`\`

### Which responses

Retry 408, 429, 502, 503 and 504. Never retry 500: it usually means a bug on their side, and retrying would hide it from our alerts.

### Waiting

Wait with **full jitter**: a random delay between zero and a ceiling that doubles with each attempt, starting at 250 ms and capped at 8 s. A \`Retry-After\` header wins over the computed delay.

### Budget

Stop after 4 attempts or 30 seconds in total, whichever comes first. The budget includes the waits, so a fully retried request stays inside the job runner's 60-second step timeout.

## Idempotency

\`GET\`, \`HEAD\`, \`OPTIONS\`, \`PUT\` and \`DELETE\` are retried. A \`POST\` or \`PATCH\` is retried only when the caller sends an \`Idempotency-Key\`, because the server then promises to deduplicate it.

> [!WARNING]
> The payments client already sends \`POST /charges\` with an \`Idempotency-Key\`. Charges will start to retry.

## API

\`\`\`ts
export interface ClientOptions {
  baseUrl: string;
  timeoutMs?: number;

  retry?: Partial<RetryPolicy> | false;
}
\`\`\`

## Rollout

| Step | Owner | Gate |
| --- | --- | --- |
| Ship with retries off by default | Billing | Tests green |
| Turn on for the billing sync | Billing | Error rate flat for two days |
| Turn on for everyone | Platform | No duplicate charges in the ledger |

- [x] Retry policy module
- [x] Abortable \`sleep\`
- [ ] Idempotency rule in \`request()\`
- [ ] Runbook entry ([billing runbook](https://example.com/runbook))

## Risks

A retried \`POST\` without real deduplication creates duplicates. Long budgets can hold a worker for 30 seconds.
