<style>
:root {
  --font-ui: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
[data-theme="light"] {
  color-scheme: light;
  --bg: #f6f5f1; --surface: #fff; --surface-2: #fbfaf7; --surface-3: #f0eee8;
  --ink: #1d1c19; --ink-2: #55524b; --ink-3: #8b877f; --ink-4: #bdb9b0;
  --line: #e9e6df; --line-2: #d9d5cb;
  --accent: #3b5bdb; --accent-bg: #eef2ff;
  --agent: #6e4ee6; --agent-bg: #f6f3ff; --agent-line: #e4dcfd;
  --add-bg: #edf8ef; --add-gutter: #dff2e3; --add-strong: #bfe6c8; --add-ink: #2b8a3e;
  --del-bg: #fdf1f1; --del-gutter: #f9e2e2; --del-strong: #f5c6c6; --del-ink: #c92a2a;
  --code-bg: #f0eee8;
  --att-high: #e8590c; --att-medium: #e9a100; --att-low: #a8a49b;
  --k-change: #e8590c; --k-question: #1c7ed6; --k-concern: #e9a100; --k-nit: #8b877f; --k-praise: #2f9e44;
  --pass: #2f9e44; --fail: #e03131; --unverified: #e9a100;
  --shadow: 0 1px 2px rgba(28, 24, 16, .04), 0 6px 20px rgba(28, 24, 16, .05);
  --shadow-lg: 0 2px 6px rgba(28, 24, 16, .06), 0 24px 64px rgba(28, 24, 16, .16);
  --tk-k: #a626a4; --tk-s: #3f8f3a; --tk-n: #986801; --tk-t: #b97a00; --tk-f: #4078f2; --tk-c: #a0a1a7; --tk-p: #0184bc;
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e0f11; --surface: #15161a; --surface-2: #18191e; --surface-3: #1f2026;
  --ink: #ecebe7; --ink-2: #a9a7a1; --ink-3: #76746f; --ink-4: #4a4946;
  --line: #25262c; --line-2: #33343c;
  --accent: #7b93ff; --accent-bg: rgba(123, 147, 255, .12);
  --agent: #a98bfa; --agent-bg: rgba(169, 139, 250, .07); --agent-line: rgba(169, 139, 250, .2);
  --add-bg: rgba(46, 160, 67, .09); --add-gutter: rgba(46, 160, 67, .15); --add-strong: rgba(46, 160, 67, .34); --add-ink: #57d377;
  --del-bg: rgba(248, 81, 73, .08); --del-gutter: rgba(248, 81, 73, .13); --del-strong: rgba(248, 81, 73, .32); --del-ink: #ff7b72;
  --code-bg: #22232a;
  --att-high: #ff8a4c; --att-medium: #f5c04a; --att-low: #6b6a66;
  --k-change: #ff8a4c; --k-question: #5aa9ff; --k-concern: #f5c04a; --k-nit: #8b8984; --k-praise: #57d377;
  --pass: #57d377; --fail: #ff6b6b; --unverified: #f5c04a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  --shadow-lg: 0 2px 8px rgba(0, 0, 0, .4), 0 30px 80px rgba(0, 0, 0, .55);
  --tk-k: #c678dd; --tk-s: #98c379; --tk-n: #d19a66; --tk-t: #e5c07b; --tk-f: #61afef; --tk-c: #7f848e; --tk-p: #56b6c2;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.55 var(--font-ui); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; }
kbd { font: 500 10.5px var(--font-ui); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line-2); border-bottom-width: 2px; color: var(--ink-3); background: var(--surface); margin-left: 2px; }
.sp { flex: 1; }
.ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic-fill { fill: currentColor; stroke: none; }
p code, li code, h1 code, h2 code, .md code { font: .88em var(--font-mono); background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 13px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 500; font-size: 13px; cursor: pointer; transition: background .15s, transform .1s; white-space: nowrap; }
.btn:hover { background: var(--surface-3); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: transparent; }
.btn.primary:hover { opacity: .88; }
.btn.primary kbd { background: transparent; color: inherit; border-color: color-mix(in srgb, var(--bg) 35%, transparent); opacity: .8; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-3); color: var(--ink); }
.btn.ghost.on { color: var(--agent); }
.btn.sm { height: 28px; padding: 0 9px; font-size: 12.5px; }
.btn.lg { height: 40px; padding: 0 18px; font-size: 14px; border-radius: 10px; }
.btn.block { width: 100%; justify-content: center; }
.btn[disabled] { opacity: .35; pointer-events: none; }
.icon-btn { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 7px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; font-weight: 600; }
.icon-btn:hover { background: var(--surface-3); color: var(--ink); }
.link { border: 0; background: none; padding: 0; color: var(--ink-3); font-size: 12.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.link:hover { color: var(--ink); }
.kbd-hint { font-size: 12px; color: var(--ink-3); }
.count { font: 600 11px var(--font-ui); color: var(--ink-3); background: var(--surface-3); border-radius: 99px; padding: 1px 7px; }
.n-add { color: var(--add-ink); font: 500 12px var(--font-mono); }
.n-del { color: var(--del-ink); font: 500 12px var(--font-mono); }
.branch { font: 500 12px var(--font-mono); padding: 2px 7px; border-radius: 6px; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; }
.logo { width: 18px; height: 18px; border-radius: 6px; background: conic-gradient(from 210deg, var(--agent), var(--accent), var(--add-ink), var(--agent)); flex: none; }
.chev { transition: transform .15s var(--ease); width: 14px; height: 14px; color: var(--ink-3); }
.chev.closed { transform: rotate(-90deg); }
.att-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--att-low); display: inline-block; flex: none; }
.att-dot.att-high { background: var(--att-high); } .att-dot.att-medium { background: var(--att-medium); }
.att-pill { display: inline-flex; align-items: center; gap: 6px; font: 600 11px var(--font-ui); letter-spacing: .02em; padding: 2px 8px 2px 7px; border-radius: 99px; color: var(--att-low); background: color-mix(in srgb, var(--att-low) 14%, transparent); text-transform: none; }
.att-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.att-pill.att-high { color: var(--att-high); background: color-mix(in srgb, var(--att-high) 12%, transparent); }
.att-pill.att-medium { color: var(--att-medium); background: color-mix(in srgb, var(--att-medium) 14%, transparent); }
.att-bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; flex: none; }
.att-bars i { width: 3px; border-radius: 1px; background: var(--line-2); }
.att-bars i:nth-child(1) { height: 5px; } .att-bars i:nth-child(2) { height: 8.5px; } .att-bars i:nth-child(3) { height: 12px; }
.att-bars.att-low i:nth-child(1) { background: var(--att-low); }
.att-bars.att-medium i:nth-child(-n+2) { background: var(--att-medium); }
.att-bars.att-high i { background: var(--att-high); }
.a-high { --a: var(--att-high); } .a-medium { --a: var(--att-medium); } .a-low { --a: var(--att-low); }

/* ---------- app frame ---------- */
.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); grid-template-rows: 54px minmax(0, 1fr); height: 100vh; }
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 12px 0 18px; border-bottom: 1px solid var(--line); background: var(--surface); }
.top-id { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 0 1 auto; }
.top-title { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cov { flex: 1; display: flex; gap: 2px; height: 10px; min-width: 160px; max-width: 560px; margin-left: auto; }
.cov i { border-radius: 2px; background: color-mix(in srgb, var(--a) 28%, var(--line)); cursor: pointer; transition: background .25s, transform .1s; min-width: 2px; }
.cov i:hover { transform: scaleY(1.5); }
.cov i.s { background: var(--pass); }
.cov i.f { box-shadow: 0 0 0 1.5px var(--ink); }
.cov-l { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
.cov-l b { color: var(--ink); }
.rail { overflow: auto; border-right: 1px solid var(--line); padding: 12px 10px 90px; display: flex; flex-direction: column; gap: 2px; }
.stage { overflow: auto; scroll-behavior: auto; }
.stage-in { max-width: 1120px; margin: 0 auto; padding: 28px 36px 160px; }

/* ---------- rail ---------- */
.lens { display: grid; grid-template-columns: 1fr 1fr; padding: 3px; border-radius: 10px; background: var(--surface-3); margin: 0 2px 12px; }
.lens button { border: 0; background: transparent; height: 28px; border-radius: 8px; font-size: 12.5px; font-weight: 600; color: var(--ink-3); cursor: pointer; }
.lens button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.r-k { font: 600 11px var(--font-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin: 14px 10px 6px; }
.r-ch { border-radius: 10px; padding-bottom: 8px; transition: background .15s; }
.r-ch:hover { background: var(--surface-3); }
.r-ch.on { background: var(--surface); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); }
.r-item { display: grid; grid-template-columns: 24px 1fr 18px; gap: 8px; align-items: start; width: 100%; text-align: left; padding: 9px 10px 4px; border: 0; border-radius: 10px; background: transparent; cursor: pointer; }
.r-item.solo { padding-bottom: 9px; }
.r-item.solo:hover { background: var(--surface-3); }
.r-item.solo.on { background: var(--surface); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); }
.r-n { font: 600 12px/20px var(--font-mono); color: var(--ink-4); }
.on > .r-n, .on > .r-item > .r-n { color: var(--ink); }
.r-t { display: grid; gap: 1px; min-width: 0; }
.r-tt { font-size: 13.5px; font-weight: 550; line-height: 1.35; }
.r-ts { font-size: 12px; color: var(--ink-3); }
.r-st { padding-top: 3px; display: grid; justify-items: end; }
.r-ch.done .r-st { color: var(--pass); }
.r-ch.done .r-tt { color: var(--ink-3); }
.strip { display: flex; flex-wrap: wrap; gap: 2px; padding: 2px 10px 0 42px; }
.strip i { height: 7px; border-radius: 2px; background: color-mix(in srgb, var(--a) 30%, var(--line)); cursor: pointer; }
.strip i.s { background: var(--pass); }
.strip i.f { box-shadow: 0 0 0 1.5px var(--ink); }
.r-grp { margin-bottom: 6px; }
.r-grp-h { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; padding: 8px 10px; border-radius: 8px; font-weight: 650; font-size: 13.5px; cursor: pointer; }
.r-grp-h:hover { background: var(--surface-3); }
.r-hunk { display: grid; grid-template-columns: 18px 1fr; gap: 8px; width: 100%; text-align: left; padding: 7px 10px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; }
.r-hunk:hover { background: var(--surface-3); }
.r-hunk.on { background: var(--surface); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); }
.r-hunk .r-hk { padding-top: 2px; color: var(--pass); display: grid; place-items: center; height: 18px; }
.r-hunk .r-hk .dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--ink-4); }
.r-hs { font-size: 13px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.r-hunk.done .r-hs { color: var(--ink-3); }

/* ---------- overview ---------- */
.eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-3); }
.ov-title { font-size: 36px; line-height: 1.14; letter-spacing: -.025em; font-weight: 680; margin: 14px 0 14px; max-width: 820px; text-wrap: balance; }
.ov-intent { font-size: 16.5px; line-height: 1.65; color: var(--ink-2); margin: 0 0 28px; max-width: 760px; text-wrap: pretty; }
.ov-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
.card { padding: 18px 20px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.card-k { display: flex; align-items: center; gap: 7px; font: 600 11.5px var(--font-ui); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 10px; }
.card.focus { background: var(--agent-bg); border-color: var(--agent-line); box-shadow: none; }
.card.focus .card-k { color: var(--agent); }
.card.focus .card-k .ic { width: 13px; height: 13px; }
.card.focus > p { margin: 0 0 12px; font-size: 15px; line-height: 1.6; }
.focus-list { display: grid; gap: 6px; }
.focus-i { display: grid; grid-template-columns: 8px 1fr auto 16px; gap: 10px; align-items: center; text-align: left; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--agent-line); background: var(--surface); cursor: pointer; transition: transform .12s; }
.focus-i:hover { transform: translateX(2px); }
.focus-i .fi-s { font-size: 13.5px; font-weight: 500; }
.focus-i .fi-m { font: 11.5px var(--font-mono); color: var(--ink-3); white-space: nowrap; }
.sec-h { display: flex; align-items: baseline; gap: 10px; margin: 44px 0 14px; }
.sec-h h2 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -.01em; }
.sec-h span { color: var(--ink-3); font-size: 13px; }
.map { padding-bottom: 14px; }
.map-row { display: grid; grid-template-columns: 170px 1fr 80px; gap: 14px; align-items: start; padding: 8px 0; border-top: 1px solid var(--line); }
.card-h + .map-row { border-top: 0; }
.map-dir { font: 12px/20px var(--font-mono); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.map-files { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.map-cl { display: inline-flex; align-items: center; gap: 7px; height: 20px; }
.map-name { font: 11px var(--font-mono); color: var(--ink-3); }
.map-blocks { display: inline-flex; gap: 3px; }
.map-b.d { box-shadow: 0 0 0 2px color-mix(in srgb, var(--att-high) 45%, transparent); }
.st-P { color: var(--agent); background: var(--agent-bg); }
.tag-diff { display: inline-flex; align-items: center; gap: 5px; font: 600 11px var(--font-ui); color: var(--att-high); background: color-mix(in srgb, var(--att-high) 11%, transparent); padding: 2px 8px; border-radius: 99px; white-space: nowrap; margin-left: 8px; }
.tag-diff .ic { width: 12px; height: 12px; }
.warn { color: var(--att-high); }
.pat-t { font-size: 13.5px; font-weight: 550; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pat-sub { padding: 8px 14px 8px 48px; font: 600 11px var(--font-ui); letter-spacing: .03em; color: var(--ink-3); background: var(--surface-2); border-top: 1px solid var(--line); }
.pat-sub:first-of-type { border-top: 0; }
.inst { font: 12.5px var(--font-mono); color: var(--ink-3); }
.inst b { color: var(--ink); font-weight: 500; }
.pat-dots { display: flex; flex-wrap: wrap; gap: 3px; }
.pat-dots i { width: 10px; height: 10px; border-radius: 3px; background: var(--line-2); }
.pat-dots i.s { background: var(--pass); }
.pat-dots i.d { box-shadow: 0 0 0 1.5px var(--att-high); }
.tcard.pat { box-shadow: var(--shadow), 4px 4px 0 -1px var(--surface), 4px 4px 0 0 var(--line), 8px 8px 0 -2px var(--surface), 8px 8px 0 -1px var(--line); margin-bottom: 8px; }
.map-b { height: 18px; border-radius: 5px; border: 1.5px solid var(--a); background: color-mix(in srgb, var(--a) 12%, transparent); cursor: pointer; padding: 0; transition: transform .12s, background .2s; }
.map-b:hover { transform: translateY(-1px); background: color-mix(in srgb, var(--a) 28%, transparent); }
.map-b.s { background: var(--a); }
.map-b.un { border-style: dashed; }
.map-n { display: flex; gap: 6px; justify-content: flex-end; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-3); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 12px; height: 10px; border-radius: 3px; border: 1.5px solid var(--a); background: color-mix(in srgb, var(--a) 14%, transparent); }
.card-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
.card-h h2 { margin: 0; font-size: 15px; font-weight: 650; }
.card-h > span { color: var(--ink-3); font-size: 12.5px; }
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-items: start; }
.col { display: grid; gap: 10px; }
.col-h { display: flex; align-items: center; gap: 9px; }
.col-h h3 { margin: 0; font-size: 15px; font-weight: 650; }
.col-d { margin: -4px 0 4px; color: var(--ink-3); font-size: 13px; }
.tcard { display: grid; gap: 8px; text-align: left; padding: 13px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); cursor: pointer; transition: transform .15s var(--ease), box-shadow .15s; }
.tcard:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.tcard.s { box-shadow: none; background: var(--surface-2); }
.tcard.s .tc-sum, .tcard.s .mini-code { opacity: .5; }
.tcard.un { border-style: dashed; border-color: color-mix(in srgb, var(--att-high) 50%, var(--line-2)); }
.tc-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tc-ch { font: 600 11px var(--font-ui); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag-un { font: 600 11px var(--font-ui); color: var(--att-high); background: color-mix(in srgb, var(--att-high) 12%, transparent); padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.seen-ic { width: 18px; height: 18px; border-radius: 50%; background: var(--pass); color: #fff; display: grid; place-items: center; flex: none; }
.seen-ic .ic { width: 11px; height: 11px; stroke-width: 2.4; }
.tc-sum { font-size: 13.5px; line-height: 1.45; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.mini-code { border-radius: 8px; overflow: hidden; border: 1px solid var(--line); font: 11px/1.6 var(--font-mono); }
.mini { display: grid; grid-template-columns: 16px minmax(0, 1fr); }
.mini span { text-align: center; }
.mini code { white-space: pre; overflow: hidden; text-overflow: ellipsis; padding-right: 8px; }
.mini.add { background: var(--add-bg); } .mini.add span { color: var(--add-ink); }
.mini.del { background: var(--del-bg); } .mini.del span { color: var(--del-ink); }
.tc-meta { display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--ink-3); }
.tc-meta .path { font: 12px var(--font-mono); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m { display: inline-flex; gap: 3px; align-items: center; font-size: 12px; color: var(--ink-3); }
.m .ic { width: 12px; height: 12px; }
.m.agent { color: var(--agent); }
.m.dec { color: var(--agent); font-weight: 600; }
.dec-list { display: grid; gap: 8px; }
.dec-row { display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.dec-row.open { border-color: color-mix(in srgb, var(--k-question) 40%, var(--line)); }
.dec-row .di { color: var(--agent); display: grid; place-items: center; font-size: 13px; }
.dec-row.open .di { color: var(--k-question); }
.dec-row-q { font-weight: 600; font-size: 14px; }
.dec-row-a { font-size: 13px; color: var(--ink-3); }
.dec-row-a b { color: var(--ink); font-weight: 600; }
.ov-cta { display: flex; align-items: center; gap: 14px; margin-top: 40px; }

/* ---------- chapter ---------- */
.ch-h { display: flex; gap: 20px; align-items: flex-start; margin: 4px 0 18px; }
.ch-num { font: 600 44px/1 var(--font-mono); letter-spacing: -.04em; padding-top: 2px; }

<script>
"use strict";
// ================================================================ helpers
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  document.querySelectorAll("[data-scroll]").forEach((el) => { if (scrolls[el.dataset.scroll] != null) el.scrollTop = scrolls[el.dataset.scroll]; });
  const stage = document.getElementById("stage");
  if (scrollTo === "top") stage.scrollTop = 0;
  else if (scrollTo) document.getElementById(`hunk-${scrollTo}`)?.scrollIntoView({ block: "start", behavior: "smooth" });
  if (scrollTo && state.focus) document.querySelector(".r-ch.on, .r-hunk.on")?.scrollIntoView({ block: "nearest" });
  scrollTo = null;
  const comp = document.getElementById("composer-text");
  if (focusComposer && comp) { comp.focus({ preventScroll: true }); comp.setSelectionRange(comp.value.length, comp.value.length); comp.scrollIntoView({ block: "nearest" }); }
  else if (focusId && document.getElementById(focusId)) {

    el.focus({ preventScroll: true });
    if (caret) try { el.setSelectionRange(caret[0], caret[1]); } catch {}
  }
  focusComposer = false;
}
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  if (ACTIONS[el.dataset.action](el.dataset, e) !== false) render();
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "composer-text") state.composer.text = t.value;
  else if (t.id === "summary") state.summary = t.value;
  else if (t.dataset.decNote) state.decisions[t.dataset.decNote].note = t.value;
});
document.addEventListener("keydown", (e) => {
  const typing = e.target.closest?.("textarea, input");
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
    e.preventDefault();
    if (e.target.id === "composer-text") saveComposer();
    else if (state.modal === "verdict" && state.verdict) ACTIONS.submit();
    else state.modal = "verdict";
    render();
    return;
  }
  if (e.key === "Escape") {
    if (state.composer) state.composer = null;
    else if (state.modal) state.modal = null;
    else return;
    render();
    return;

  const k = e.key;
  if (k === " ") { stage.scrollBy({ top: (e.shiftKey ? -1 : 1) * stage.clientHeight * 0.85, behavior: "smooth" }); e.preventDefault(); return; }
  if (k === "d" || k === "u") { stage.scrollBy({ top: (k === "u" ? -1 : 1) * stage.clientHeight * 0.5, behavior: "smooth" }); return; }
  const f = state.focus;
  if (k === "j" || k === "k") step(k === "j" ? 1 : -1);
  else if (k === "]" || k === "[") chapterStep(k === "]" ? 1 : -1);
  else if (k === "Enter" && e.shiftKey && f && PATTERN_OF[f]) { const hs = PATTERNS[PATTERN_OF[f]].hunks; for (const id of hs) { state.seen[id] = true; delete state.open[id]; } state.focus = state.lens === "story" ? hs[hs.length - 1] : f; seenNext(); }
  else if (k === "Enter") seenNext();
  else if (k === "r" && state.page !== "overview" && state.page !== "hunk") ACTIONS["chapter-done"]();
  else if (k === "x" && f && state.page !== "hunk") state.open[f] = !isOpen(f);
  else if (k === "X" && state.page !== "overview" && state.page !== "hunk") { const ids = pageHunks(state.page), anyOpen = ids.some(isOpen); for (const id of ids) state.open[id] = !anyOpen; }
  else if ((k === "c" || k === "a") && f && state.page !== "overview") composeOn(f, k === "a" ? "ask" : "comment");
  else if (k === "b" && state.page !== "overview") { const key = state.page === "hunk" ? CHAPTER_OF[f] && `h:${CHAPTER_OF[f].id}` : `c:${state.page}`; if (!key) return; ACTIONS.brief({ key }); }
  else if (k === "n") ACTIONS.notes();
  else if (k === "l") ACTIONS.lens({ lens: state.lens === "story" ? "attention" : "story" });
  else if (k === "o") { state.page = "overview"; state.lens = "story"; scrollTo = "top"; }
  else if (k === "?") state.modal = "keys";
  else return;
  e.preventDefault();
  render();
});
render();
