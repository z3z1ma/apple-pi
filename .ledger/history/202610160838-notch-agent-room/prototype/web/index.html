<!doctype html>
<!-- PROTOTYPE: notch pill renderer. Inside NotchShell it gets live agents; opened alone in a browser it uses mock agents. -->
<html>
<head>
<meta charset="utf-8">
<style>
	:root {
		--waiting: #fae3b0; --done: #abe9b3; --working: #f5c2e7; --quiet: #7f849c;
		--ease: cubic-bezier(.32, .72, 0, 1);
	}
	html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
		font: 12px/1.3 -apple-system, BlinkMacSystemFont, sans-serif; color: #cdd6f4; user-select: none; cursor: default; }
	body.browser { background: linear-gradient(#3b4252 0 32px, #1e1e2e 32px); }
	#island {
		position: absolute; top: 0; left: 50%; transform: translateX(-50%);
		background: #000; border-radius: 0 0 14px 14px; overflow: hidden;
		transition: width .35s var(--ease), height .35s var(--ease), border-radius .35s var(--ease);
	}
	#island.open { border-radius: 0 0 22px 22px; }
	#bar { display: flex; align-items: center; justify-content: space-between; padding: 0 14px; height: var(--notch-height); }
	.wing { display: flex; align-items: center; gap: 5px; }
	.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
	.dot.working { animation: pulse 1.6s ease-in-out infinite; }
	@keyframes pulse { 50% { opacity: .35; } }
	.count { color: var(--quiet); font-weight: 600; font-size: 11px; }
	#list { width: 560px; box-sizing: border-box; padding: 4px 10px 12px; opacity: 0; transition: opacity .2s; }
	#island.open #list { opacity: 1; transition-delay: .12s; }
	.row { display: grid; grid-template-columns: 8px 1fr auto; gap: 4px 10px; align-items: center;
		padding: 7px 10px; border-radius: 10px; }
	.row:hover { background: #1e1e2e; }
	.name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.state { font-size: 11px; color: var(--c); }
	.what { grid-column: 2 / 4; color: var(--quiet); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; }
	.what b { color: #a6adc8; font-weight: 500; }
	.empty { padding: 10px; color: var(--quiet); text-align: center; }
</style>
</head>
<body>
<div id="island"><div id="bar"><div class="wing" id="left"></div><div class="wing" id="right"></div></div><div id="list"></div></div>
<script>
const shell = window.webkit?.messageHandlers?.notch;
const geo = window.notchGeometry ?? { notchWidth: 185, notchHeight: 32, width: 720, height: 460 };
const island = document.getElementById("island");
const bar = document.getElementById("bar");
const list = document.getElementById("list");
const label = { waiting: "needs you", done: "done", working: "working", quiet: "quiet" };
const order = { waiting: 0, done: 1, working: 2, quiet: 3 };
const OPEN_WIDTH = list.offsetWidth;
document.documentElement.style.setProperty("--notch-height", `${geo.notchHeight}px`);
let agents = [];
let open = false;

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => `&#${c.charCodeAt(0)};`);

function render() {
	const sorted = [...agents].sort((a, b) => order[a.state] - order[b.state]);
	const attention = sorted.filter((a) => a.state === "waiting" || a.state === "done");
	document.getElementById("left").innerHTML =
		`<span class="count">π ${agents.length}</span>` +
		attention.map((a) => `<span class="dot" style="--c:var(--${a.state})"></span>`).join("");
	document.getElementById("right").innerHTML = sorted
		.filter((a) => a.state === "working" || a.state === "quiet")
		.map((a) => `<span class="dot ${a.state}" style="--c:var(--${a.state})"></span>`).join("");
	list.innerHTML = sorted.length
		? sorted.map((a, i) => `
			<div class="row" data-i="${i}" style="--c:var(--${a.state})">
				<span class="dot ${a.state}"></span>
				<span class="name">${esc(a.name)}</span>
				<span class="state">${label[a.state]}</span>
				<span class="what">${esc(a.project)}${a.tool ? ` · <b>${esc(a.tool)}</b> ${esc(a.detail)}` : ""}</span>
			</div>`).join("")
		: `<div class="empty">No pi agents in tmux</div>`;
	list.querySelectorAll(".row").forEach((row) => {
		row.onclick = () => focusAgent(sorted[row.dataset.i]);
	});
	layout();
}

function layout() {
	const wing = Math.max(...[...bar.querySelectorAll(".wing")].map((w) => w.scrollWidth), 24) + 14;
	const width = open ? OPEN_WIDTH : geo.notchWidth + 2 * wing;
	const height = open ? geo.notchHeight + list.scrollHeight : geo.notchHeight;
	island.style.width = `${width}px`;
	island.style.height = `${height}px`;
	island.classList.toggle("open", open);
	// Report the final shape at once, so the pointer is not judged outside while the expansion animates.
	shell?.postMessage({ type: "hit", x: (geo.width - width) / 2, y: 0, w: width, h: height });
}

function focusAgent(agent) {
	if (shell) shell.postMessage({ type: "focus", paneId: agent.paneId, tmuxSession: agent.tmuxSession });
	else console.log("focus", agent.paneId);
}

window.notch = {
	update(next) { agents = next; render(); },
	hover(inside) { if (inside !== open) { open = inside; layout(); } },
};

if (!shell) {
	document.body.classList.add("browser");
	island.onmouseenter = () => window.notch.hover(true);
	island.onmouseleave = () => window.notch.hover(false);
	const states = ["working", "quiet", "waiting", "done"];
	const mock = [
		["Pixel Notch Agent Room", "apple-pi", "bash", "swiftc -O NotchShell.swift"],
		["Prune Low-Value Vitest Tests", "apple-pi", "edit", "tests/package-load.mjs"],
		["Grafana latency triage", "checkout", "mcp__grafana", "query p99"],
		["Release notes", "website", "read", "CHANGELOG.md"],
	].map(([name, project, tool, detail], i) => ({ name, project, tool, detail, state: states[i], paneId: `%${i}` }));
	window.notch.update(mock);
	setInterval(() => {
		const a = mock[Math.floor(Math.random() * mock.length)];
		a.state = states[(states.indexOf(a.state) + 1) % states.length];
		window.notch.update(mock);
	}, 3000);
} else {
	render();
}
</script>
</body>
</html>
