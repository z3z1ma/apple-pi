<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROTOTYPE · Code review surface</title>
<!--
  PROTOTYPE. Throwaway. Three structurally different variants of the code review page on one file,
  switchable with the bottom bar, the ←/→ keys, or ?variant=A|B|C. Fake data, in-memory state, no harness.
-->
<style>
:root {
  --font-ui: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
  --font-serif: ui-serif, "New York", "Iowan Old Style", Charter, Georgia, serif;
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
[data-theme="light"] {
  color-scheme: light;
  --bg: #f6f5f1; --surface: #fff; --surface-2: #fbfaf7; --surface-3: #f0eee8;
  --ink: #1d1c19; --ink-2: #55524b; --ink-3: #8b877f; --ink-4: #bdb9b0;
  --line: #e9e6df; --line-2: #d9d5cb;
  --accent: #3b5bdb; --accent-bg: #eef2ff;
  --agent: #6e4ee6; --agent-bg: #f6f3ff; --agent-line: #e4dcfd;
  --add-bg: #edf8ef; --add-gutter: #dff2e3; --add-strong: #bfe6c8; --add-ink: #2b8a3e;
  --del-bg: #fdf1f1; --del-gutter: #f9e2e2; --del-strong: #f5c6c6; --del-ink: #c92a2a;
  --hunk-bg: #f8f7f3; --code-bg: #f0eee8;
  --att-high: #e8590c; --att-medium: #e9a100; --att-low: #a8a49b;
  --k-change: #e8590c; --k-question: #1c7ed6; --k-concern: #e9a100; --k-nit: #8b877f; --k-praise: #2f9e44;
  --pass: #2f9e44; --fail: #e03131; --unverified: #e9a100;
  --shadow: 0 1px 2px rgba(28, 24, 16, .04), 0 6px 20px rgba(28, 24, 16, .05);
  --shadow-lg: 0 2px 6px rgba(28, 24, 16, .06), 0 24px 64px rgba(28, 24, 16, .16);
  --tk-k: #a626a4; --tk-s: #3f8f3a; --tk-n: #986801; --tk-t: #b97a00; --tk-f: #4078f2; --tk-c: #a0a1a7; --tk-p: #0184bc;
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e0f11; --surface: #15161a; --surface-2: #18191e; --surface-3: #1f2026;
  --ink: #ecebe7; --ink-2: #a9a7a1; --ink-3: #76746f; --ink-4: #4a4946;
  --line: #25262c; --line-2: #33343c;
  --accent: #7b93ff; --accent-bg: rgba(123, 147, 255, .12);
  --agent: #a98bfa; --agent-bg: rgba(169, 139, 250, .07); --agent-line: rgba(169, 139, 250, .2);
  --add-bg: rgba(46, 160, 67, .09); --add-gutter: rgba(46, 160, 67, .15); --add-strong: rgba(46, 160, 67, .34); --add-ink: #57d377;
  --del-bg: rgba(248, 81, 73, .08); --del-gutter: rgba(248, 81, 73, .13); --del-strong: rgba(248, 81, 73, .32); --del-ink: #ff7b72;
  --hunk-bg: #121317; --code-bg: #22232a;
  --att-high: #ff8a4c; --att-medium: #f5c04a; --att-low: #6b6a66;
  --k-change: #ff8a4c; --k-question: #5aa9ff; --k-concern: #f5c04a; --k-nit: #8b8984; --k-praise: #57d377;
  --pass: #57d377; --fail: #ff6b6b; --unverified: #f5c04a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  --shadow-lg: 0 2px 8px rgba(0, 0, 0, .4), 0 30px 80px rgba(0, 0, 0, .55);
  --tk-k: #c678dd; --tk-s: #98c379; --tk-n: #d19a66; --tk-t: #e5c07b; --tk-f: #61afef; --tk-c: #7f848e; --tk-p: #56b6c2;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.55 var(--font-ui); -webkit-font-smoothing: antialiased; }
body[data-variant="B"] { overflow: hidden; }
button { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; cursor: pointer; }
kbd { font: 500 10.5px var(--font-ui); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line-2); border-bottom-width: 2px; color: var(--ink-3); background: var(--surface); margin-left: 2px; }
.sp { flex: 1; }
.ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic-fill { fill: currentColor; stroke: none; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 13px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 500; font-size: 13px; cursor: pointer; transition: background .15s, border-color .15s, transform .1s; white-space: nowrap; }
.btn:hover { background: var(--surface-3); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: transparent; }
.btn.primary:hover { opacity: .88; }
.btn.primary kbd { background: transparent; color: inherit; border-color: color-mix(in srgb, var(--bg) 35%, transparent); opacity: .8; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-3); }
.btn.lg { height: 40px; padding: 0 18px; font-size: 14px; border-radius: 10px; }
.btn.done { color: var(--pass); border-color: color-mix(in srgb, var(--pass) 35%, var(--line-2)); }
.btn[disabled] { opacity: .35; pointer-events: none; }
.btn.block { width: 100%; justify-content: center; }
.icon-btn { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 7px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; }
.icon-btn:hover { background: var(--surface-3); color: var(--ink); }
.icon-btn[disabled] { opacity: .3; pointer-events: none; }
.link { border: 0; background: none; padding: 0; color: var(--ink-3); font-size: 12.5px; cursor: pointer; }
.link:hover { color: var(--ink); }
.kbd-hint { font-size: 12px; color: var(--ink-3); }
.count { font: 600 11px var(--font-ui); color: var(--ink-3); background: var(--surface-3); border-radius: 99px; padding: 1px 7px; }
.n-add { color: var(--add-ink); font: 500 12px var(--font-mono); }
.n-del { color: var(--del-ink); font: 500 12px var(--font-mono); }
.branch { font: 500 12px var(--font-mono); padding: 2px 7px; border-radius: 6px; background: var(--surface-3); color: var(--ink-2); }
.eyebrow { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-3); }
.logo { width: 18px; height: 18px; border-radius: 6px; background: conic-gradient(from 210deg, var(--agent), var(--accent), var(--add-ink), var(--agent)); flex: none; }
.progress { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.progress > div { height: 100%; background: var(--pass); border-radius: 4px; transition: width .4s var(--ease); }
.att-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--att-low); display: inline-block; }
.att-dot.att-high { background: var(--att-high); } .att-dot.att-medium { background: var(--att-medium); }
.att-pill { display: inline-flex; align-items: center; gap: 6px; font: 600 11px var(--font-ui); letter-spacing: .02em; padding: 2px 8px 2px 7px; border-radius: 99px; color: var(--att-low); background: color-mix(in srgb, var(--att-low) 14%, transparent); text-transform: none; }
.att-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.att-pill.att-high { color: var(--att-high); background: color-mix(in srgb, var(--att-high) 12%, transparent); }
.att-pill.att-medium { color: var(--att-medium); background: color-mix(in srgb, var(--att-medium) 14%, transparent); }
.att-bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
.att-bars i { width: 3px; border-radius: 1px; background: var(--line-2); }
.att-bars i:nth-child(1) { height: 5px; } .att-bars i:nth-child(2) { height: 8.5px; } .att-bars i:nth-child(3) { height: 12px; }
.att-bars.att-low i:nth-child(1) { background: var(--att-low); }
.att-bars.att-medium i:nth-child(-n+2) { background: var(--att-medium); }
.att-bars.att-high i { background: var(--att-high); }

/* ---------- diff ---------- */
.diff { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; box-shadow: var(--shadow); margin: 0 0 18px; }
.diff-h { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.diff-h .path { font: 12.5px var(--font-mono); color: var(--ink-3); }
.diff-h .path b { color: var(--ink); font-weight: 600; }
.st { font: 600 10.5px var(--font-ui); letter-spacing: .04em; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; color: var(--ink-3); background: var(--surface-3); }
.st-A { color: var(--add-ink); background: var(--add-bg); }
.hunk + .hunk { border-top: 1px solid var(--line); }
.hunk-h { display: flex; align-items: baseline; gap: 12px; padding: 8px 14px 8px 102px; background: var(--hunk-bg); border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
.hunk-h .hs { flex: 1; }
.hunk-h .hs code, p code, li code, .dec-q code, .dec-detail code, .co-b code, .note-b code, .cmt-b code, .v-l code, .vc-card-sum code, h2 code, .vb-tt code { font: .88em var(--font-mono); background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
.hunk-h .hr { font: 11.5px var(--font-mono); color: var(--ink-3); white-space: nowrap; }
.hunk-h.un .hs { color: var(--att-high); }
.dl { display: grid; grid-template-columns: 84px 18px minmax(0, 1fr); font: 12.5px/1.7 var(--font-mono); position: relative; }
.dl .g { display: grid; grid-template-columns: 1fr 1fr; border: 0; padding: 0 6px 0 0; background: transparent; color: var(--ink-4); font: inherit; text-align: right; cursor: pointer; position: relative; user-select: none; }
.dl .g span { padding-right: 4px; }
.dl .g:hover { color: var(--ink-2); }
.dl:hover .g::before { content: "+"; position: absolute; left: 6px; top: 3px; width: 16px; height: 16px; border-radius: 5px; background: var(--accent); color: #fff; display: grid; place-items: center; font: 600 13px/1 var(--font-ui); box-shadow: 0 1px 3px rgba(0, 0, 0, .2); }
.dl .sg { text-align: center; color: var(--ink-4); user-select: none; }
.dl code { white-space: pre-wrap; overflow-wrap: anywhere; padding: 0 18px 0 4ch; text-indent: -4ch; tab-size: 2; }
.diff.new .dl.add, .diff.new .dl.add .g { background: transparent; }
.diff.new .dl.add .g { color: var(--ink-4); }
.diff.new .dl .sg { visibility: hidden; }
.diff.new .hunk { box-shadow: inset 3px 0 0 var(--add-strong); }
.dl.add { background: var(--add-bg); } .dl.add .g { background: var(--add-gutter); color: color-mix(in srgb, var(--add-ink) 55%, transparent); } .dl.add .sg { color: var(--add-ink); }
.dl.del { background: var(--del-bg); } .dl.del .g { background: var(--del-gutter); color: color-mix(in srgb, var(--del-ink) 55%, transparent); } .dl.del .sg { color: var(--del-ink); }
.dl.has-c .g::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--k-change); }
.dl.sel { background: var(--accent-bg); } .dl.sel .g { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.dl.sel .g::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); }
mark { color: inherit; border-radius: 3px; padding: 1px 0; }
mark.wa { background: var(--add-strong); } mark.wd { background: var(--del-strong); }
.tk-k { color: var(--tk-k); } .tk-s { color: var(--tk-s); } .tk-n { color: var(--tk-n); } .tk-t { color: var(--tk-t); }
.tk-f { color: var(--tk-f); } .tk-c { color: var(--tk-c); font-style: italic; } .tk-p { color: var(--tk-p); } .tk-h { font-weight: 700; }

/* inline blocks inside a diff: agent notes, comments, composer */
.inl { margin: 8px 18px 10px 102px; font: 13.5px/1.55 var(--font-ui); }
.note { padding: 10px 14px 10px 13px; border-radius: 10px; background: var(--agent-bg); border: 1px solid var(--agent-line); }
.note-h, .cmt-h { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-3); margin-bottom: 3px; }
.note-h .who { color: var(--agent); font-weight: 600; }
.note-h .ic { color: var(--agent); width: 13px; height: 13px; }
.note-b { color: var(--ink); }
.note .replies { margin-top: 10px; display: grid; gap: 8px; }
.note .replies .cmt, .note .replies .composer { margin: 0; background: var(--surface); }
.note-actions { margin-top: 6px; }
.cmt { padding: 10px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line-2); border-left: 3px solid var(--k-change); box-shadow: var(--shadow); }
.cmt-h .who { color: var(--ink); font-weight: 600; }
.kind { font-weight: 600; font-size: 11px; letter-spacing: .02em; color: var(--k-change); }
.k-question { --k: var(--k-question); } .k-change { --k: var(--k-change); } .k-concern { --k: var(--k-concern); } .k-nit { --k: var(--k-nit); } .k-praise { --k: var(--k-praise); }
.cmt.k-question, .cmt.k-concern, .cmt.k-nit, .cmt.k-praise, .cmt.k-change { border-left-color: var(--k); }
.cmt .kind { color: var(--k); }
.cmt-h .where { font-family: var(--font-mono); font-size: 11.5px; }
.av { width: 18px; height: 18px; border-radius: 50%; background: var(--ink); color: var(--bg); font: 700 10px/18px var(--font-ui); text-align: center; }
.composer { padding: 12px; border-radius: 12px; background: var(--surface); border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line-2)); box-shadow: 0 0 0 4px var(--accent-bg), var(--shadow); }
.composer-top { display: flex; align-items: baseline; gap: 10px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 8px; }
.composer-top b { font-weight: 600; color: var(--ink); }
.composer-top .kbd-hint { margin-left: auto; }
.kinds { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.kind-chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 99px; border: 1px solid var(--line-2); background: transparent; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
.kind-chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--k); }
.kind-chip.on { border-color: var(--k); color: var(--ink); background: color-mix(in srgb, var(--k) 10%, transparent); }
textarea { width: 100%; resize: vertical; border: 1px solid var(--line-2); border-radius: 9px; background: var(--surface-2); color: var(--ink); font: 14px/1.5 var(--font-ui); padding: 9px 11px; outline: none; transition: border-color .15s, box-shadow .15s; }
textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); background: var(--surface); }
.composer-foot, .vd-foot { display: flex; align-items: center; gap: 8px; margin-top: 8px; }

/* ---------- shared content blocks ---------- */
.callout { display: flex; gap: 12px; padding: 13px 16px; border-radius: 12px; background: color-mix(in srgb, var(--att-medium) 9%, var(--surface)); border: 1px solid color-mix(in srgb, var(--att-medium) 30%, var(--line)); margin: 18px 0; }
.callout .co-ic { color: var(--att-medium); padding-top: 2px; }
.co-t { font: 600 12px var(--font-ui); letter-spacing: .03em; text-transform: uppercase; color: var(--att-medium); margin-bottom: 2px; }
.co-b { font-size: 14px; line-height: 1.6; }
.decision { padding: 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); margin: 18px 0; }
.decision.open { border-color: color-mix(in srgb, var(--k-question) 40%, var(--line)); }
.dec-h { display: flex; align-items: center; gap: 7px; font: 600 11.5px var(--font-ui); letter-spacing: .04em; text-transform: uppercase; color: var(--agent); margin-bottom: 6px; }
.decision.open .dec-h { color: var(--k-question); }
.dec-h .ic { width: 14px; height: 14px; }
.dec-done { margin-left: auto; display: inline-flex; gap: 4px; align-items: center; color: var(--pass); text-transform: none; letter-spacing: 0; font-size: 12px; }
.dec-q { font: 600 16px/1.4 var(--font-ui); margin-bottom: 4px; }
.dec-ctx { margin: 0 0 12px; color: var(--ink-2); font-size: 13.5px; }
.dec-opts { display: grid; gap: 6px; }
.dec-opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; transition: border-color .15s, background .15s; }
.dec-opt:hover { border-color: var(--line-2); background: var(--surface-3); }
.dec-opt .radio { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--ink-4); margin-top: 2px; flex: none; transition: all .15s; }
.dec-opt.on { border-color: var(--accent); background: var(--accent-bg); }
.dec-opt.on .radio { border: 5px solid var(--accent); }
.dec-body { display: grid; gap: 2px; }
.dec-label { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.dec-detail { color: var(--ink-2); font-size: 13px; }
.tag-agent { display: inline-flex; align-items: center; gap: 4px; font: 600 10.5px var(--font-ui); color: var(--agent); background: var(--agent-bg); border: 1px solid var(--agent-line); padding: 1px 7px; border-radius: 99px; }
.tag-agent .ic { width: 10px; height: 10px; }
.dec-note { margin-top: 10px; font-size: 13.5px; }
.verif { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.verif li { display: grid; grid-template-columns: 16px 1fr; gap: 10px; align-items: start; font-size: 13.5px; line-height: 1.5; }
.verif .v-ic { padding-top: 2px; }
.v-d { margin-left: 6px; }
.verif .v-ic .ic { width: 15px; height: 15px; }
.v-pass .v-ic { color: var(--pass); } .v-fail .v-ic { color: var(--fail); } .v-unverified .v-ic { color: var(--unverified); }
.v-l { font-weight: 500; }
.v-d { color: var(--ink-3); font-size: 12.5px; }
.verdict { display: grid; gap: 14px; }
.vd-stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ink-3); }
.vd-stats b { color: var(--ink); font-weight: 600; }
.vd-stats .warn { color: var(--att-medium); }
.vd-opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.vd-opt { display: grid; gap: 3px; text-align: left; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; transition: all .15s; }
.vd-opt:hover { background: var(--surface-3); }
.vd-l { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.vd-l::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--vc); }
.vd-d { color: var(--ink-3); font-size: 12.5px; }
.vd-approve { --vc: var(--pass); } .vd-approve_notes { --vc: var(--att-medium); } .vd-changes { --vc: var(--k-change); }
.vd-opt.on { border-color: var(--vc); background: color-mix(in srgb, var(--vc) 9%, var(--surface)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--vc) 14%, transparent); }

/* ---------- overlays ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 55%, transparent); backdrop-filter: blur(6px); animation: fade .18s var(--ease); }
.modal { width: min(760px, calc(100vw - 48px)); max-height: calc(100vh - 96px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow-lg); padding: 22px 24px 24px; animation: rise .22s var(--ease); }
.modal-h { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.modal-h h3 { margin: 0; font-size: 17px; font-weight: 650; }
.modal-sub { color: var(--ink-3); font-size: 13px; margin: -8px 0 14px; }
.sim { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--surface-3); color: var(--ink-2); font-size: 13px; margin-bottom: 12px; }
pre.json { margin: 0; padding: 14px 16px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); font: 12px/1.6 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.j-k { color: var(--tk-p); } .j-s { color: var(--tk-s); } .j-n { color: var(--tk-n); } .j-b { color: var(--tk-k); }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.985); } }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } }

/* ---------- prototype switcher (not part of the design) ---------- */
.proto-bar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 100; display: flex; align-items: center; gap: 4px; padding: 5px 6px 5px 12px; border-radius: 99px; background: #111; color: #f2f2f2; box-shadow: 0 8px 30px rgba(0, 0, 0, .35); font: 12.5px var(--font-ui); }

      <div class="vc-row">
        <div class="vc-panel"><div class="k">Verification</div>${renderVerification()}</div>
        <div class="vc-panel"><div class="k">Coverage</div><div class="vd-stats" style="font-size:14px"><span><b>${s.covered}</b> of ${ALL.length} hunks seen</span><span><b>${s.comments}</b> ${s.comments === 1 ? "comment" : "comments"}</span><span><b>${s.answered}</b> of ${DECISIONS.length} decisions answered</span></div><div class="progress" style="margin-top:12px"><div style="width:${(s.covered / ALL.length) * 100}%"></div></div></div>
      </div>
      <section class="vc-qs">
        <div class="vc-sec-h"><h2>Decisions to confirm</h2><span>${s.answered} of ${DECISIONS.length} answered</span></div>
        <div class="vc-q-grid">${DECISIONS.map(renderDecision).join("")}</div>
      </section>
      <div class="vc-sec-h"><h2>Changes by attention</h2><span>${ALL.length} hunks</span></div>
      <section class="vc-board">${COLUMNS.map((col) => {
        const ids = order.filter((id) => attOf(id) === col.att);
        return `<div class="vc-col"><div class="vc-col-h"><span class="att-bars att-${col.att}"><i></i><i></i><i></i></span><h3>${col.label}</h3><span class="count">${ids.length}</span></div><p class="vc-col-d">${col.detail}</p>${ids.map(renderCard).join("")}${col.att === "low" ? `<button class="btn ghost block" data-action="seen-all-low">${I.check} Mark all as seen</button>` : ""}</div>`;
      }).join("")}</section>
    </div>
    ${state.openHunk ? renderSheet() : ""}
    ${renderModal()}
  </div>`;
}

// ---------------------------------------------------------------- render loop
const VARIANTS = { A: { name: "Essay", render: renderA }, B: { name: "Cockpit", render: renderB }, C: { name: "Triage", render: renderC } };
const app = document.getElementById("app");
let focusComposer = false, resetScroll = null;
function render() {
  const scrolls = {};
  document.querySelectorAll("[data-scroll]").forEach((el) => (scrolls[el.dataset.scroll] = el.scrollTop));
  const y = window.scrollY;
  const active = document.activeElement;
  const focusId = active && active.id;
  const caret = focusId && "selectionStart" in active ? [active.selectionStart, active.selectionEnd] : null;
  document.documentElement.dataset.theme = state.theme;
  document.body.dataset.variant = state.variant;
  app.innerHTML = VARIANTS[state.variant].render();
  document.getElementById("proto").innerHTML = `<div class="proto-bar"><span class="proto-tag">Prototype</span><button data-action="variant" data-d="-1">${I.chevL}</button><span class="proto-v"><b>${state.variant}</b>${VARIANTS[state.variant].name}</span><button data-action="variant" data-d="1">${I.chevR}</button><span class="proto-sep"></span><button data-action="theme">${state.theme === "dark" ? I.sun : I.moon}</button><button data-action="modal" data-m="payload">Agent input</button><button data-action="modal" data-m="result">Result</button></div>`;
  document.querySelectorAll("[data-scroll]").forEach((el) => { if (el.dataset.scroll !== resetScroll && scrolls[el.dataset.scroll] != null) el.scrollTop = scrolls[el.dataset.scroll]; });
  if (resetScroll !== "window") window.scrollTo(0, y); else window.scrollTo(0, 0);
  resetScroll = null;
  const comp = document.getElementById("composer-text");
  if (focusComposer && comp) { comp.focus(); comp.setSelectionRange(comp.value.length, comp.value.length); }
  else if (focusId && document.getElementById(focusId)) {
    const el = document.getElementById(focusId);
    el.focus({ preventScroll: true });
    if (caret) try { el.setSelectionRange(caret[0], caret[1]); } catch {}
  }
  focusComposer = false;
  scrollSpyA();
}
function setUrl() {
  const p = new URLSearchParams({ variant: state.variant });
  if (state.theme === "dark") p.set("theme", "dark");
  history.replaceState(null, "", `?${p}`);
}
function saveComposer() {
  const c = state.composer;
  if (!c || !c.text.trim()) return;
  state.comments.push({ id: `m${++seq}`, hunk: c.hunk, start: c.start, end: c.end, kind: c.kind, text: c.text.trim(), replyTo: c.replyTo });
  state.composer = null;
}
function step(d) {
  const ids = [...CHAPTERS.map((c) => c.id), ...(UNPLACED.length ? ["unplaced"] : [])];
  const i = ids.indexOf(state.current) + d;
  if (i >= 0 && i < ids.length) { state.current = ids[i]; resetScroll = "stage"; }
  else if (i >= ids.length) state.modal = "verdict";
}
function sheetNav(d) {
  const order = boardOrder(), i = order.indexOf(state.openHunk) + d;
  if (i >= 0 && i < order.length) { state.openHunk = order[i]; resetScroll = "sheet"; state.composer = null; }
  else state.openHunk = null;
}
const ACTIONS = {
  noop: () => false,
  line(d, e) {
    const i = +d.i, c = state.composer;
    if (c && !c.replyTo && c.hunk === d.hunk && e.shiftKey) { c.start = Math.min(c.anchor, i); c.end = Math.max(c.anchor, i); }
    else state.composer = { hunk: d.hunk, anchor: i, start: i, end: i, kind: "change", text: "" };
    focusComposer = true;
  },
  reply(d) { const n = NOTE[d.note]; state.composer = { hunk: n.hunk, anchor: n.idx, start: n.idx, end: n.idx, kind: "question", text: "", replyTo: n.id }; focusComposer = true; },
  kind(d) { state.composer.kind = d.kind; focusComposer = true; },
  cancel() { state.composer = null; },
  save: saveComposer,
  del(d) { state.comments = state.comments.filter((m) => m.id !== d.id); },
  decide(d) { const st = (state.decisions[d.dec] ||= {}); st.choice = +d.i; },
  review(d) { state.reviewed[d.id] = !state.reviewed[d.id]; },
  "seen-unplaced"() { const all = UNPLACED.every(covered); for (const id of UNPLACED) state.seen[id] = !all; },
  goto(d) { document.getElementById(`ch-${d.id}`)?.scrollIntoView({ behavior: "smooth", block: "start" }); return false; },
  select(d) { state.current = d.id; resetScroll = "stage"; },
  step(d) { step(+d.d); },
  "review-next"() {
    if (state.current === "unplaced") for (const id of UNPLACED) state.seen[id] = true;
    else state.reviewed[state.current] = true;
    step(1);
  },
  tab(d) { state.tab = d.tab; },
  jump(d) {
    state.current = CHAPTER_OF[d.hunk]?.id || "unplaced";
    render();
    document.getElementById(`hunk-${d.hunk}`)?.scrollIntoView({ behavior: "smooth", block: "start" });
    return false;
  },
  verdict(d) { state.verdict = d.v; },
  submit() { if (!state.verdict) return false; state.submitted = true; state.modal = "result"; },
  modal(d) { state.modal = d.m; },
  "close-modal"() { state.modal = null; },
  "open-hunk"(d) { state.openHunk = d.hunk; state.composer = null; resetScroll = "sheet"; },
  "close-sheet"() { state.openHunk = null; state.composer = null; },
  "sheet-nav"(d) { sheetNav(+d.d); },
  "seen-next"() { state.seen[state.openHunk] = true; sheetNav(1); },
  "seen-all-low"() { for (const id of ALL) if (attOf(id) === "low" && CHAPTER_OF[id]) state.seen[id] = true; },
  variant(d) {
    const keys = Object.keys(VARIANTS);
    state.variant = keys[(keys.indexOf(state.variant) + +d.d + keys.length) % keys.length];
    state.composer = null; state.openHunk = null; state.modal = null; resetScroll = "window";
    setUrl();
  },
  theme() { state.theme = state.theme === "dark" ? "light" : "dark"; setUrl(); },
};
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  if (el.tagName === "A") e.preventDefault();
  if (ACTIONS[el.dataset.action](el.dataset, e) !== false) render();
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "composer-text") state.composer.text = t.value;
  else if (t.id === "summary") state.summary = t.value;
  else if (t.dataset.decNote) state.decisions[t.dataset.decNote].note = t.value;
});
document.addEventListener("keydown", (e) => {
  const typing = e.target.closest?.("textarea, input");
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
    if (e.target.id === "composer-text") { saveComposer(); render(); }
    else if (e.target.id === "summary" && state.verdict) { ACTIONS.submit(); render(); }
    return;
  }
  if (e.key === "Escape") {
    if (state.composer) state.composer = null;
    else if (state.modal) state.modal = null;
    else if (state.openHunk) state.openHunk = null;
    else return;
    render();
    return;
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  const key = e.key.toLowerCase();
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") ACTIONS.variant({ d: e.key === "ArrowLeft" ? -1 : 1 });
  else if (state.variant === "B" && (key === "j" || key === "k")) step(key === "j" ? 1 : -1);
  else if (state.variant === "B" && key === "r") ACTIONS["review-next"]();
  else if (state.variant === "C" && state.openHunk && (key === "j" || key === "k")) sheetNav(key === "j" ? 1 : -1);
  else if (state.variant === "C" && state.openHunk && e.key === "Enter") ACTIONS["seen-next"]();
  else return;
  e.preventDefault();
  render();
});
window.addEventListener("scroll", scrollSpyA, { passive: true });
render();
</script>
</body>
</html>
