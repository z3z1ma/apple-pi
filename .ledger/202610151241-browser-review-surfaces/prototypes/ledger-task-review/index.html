/* ---------- controls ---------- */

/* inline blocks in the diff */
.inl { margin: 6px 18px 8px 102px; font: 13.5px/1.55 var(--font-ui); }
.note-c { display: flex; align-items: center; gap: 8px; width: calc(100% - 120px); height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--agent-line); background: var(--agent-bg); color: var(--ink-2); cursor: pointer; text-align: left; font-size: 12.5px; }

.note { padding: 10px 14px 10px 13px; border-radius: 10px; background: var(--agent-bg); border: 1px solid var(--agent-line); }

.where { font-family: var(--font-mono); font-size: 11.5px; }
.av { width: 18px; height: 18px; border-radius: 50%; background: var(--ink); color: var(--bg); font: 700 10px/18px var(--font-ui); text-align: center; flex: none; }
.composer { padding: 12px; border-radius: 12px; background: var(--surface); border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line-2)); box-shadow: 0 0 0 4px var(--accent-bg), var(--shadow); }

.seg { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--surface-3); }

.kinds { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }

.kind-chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--k); }

textarea { width: 100%; resize: vertical; border: 1px solid var(--line-2); border-radius: 9px; background: var(--surface-2); color: var(--ink); font: 14px/1.5 var(--font-ui); padding: 9px 11px; outline: none; transition: border-color .15s, box-shadow .15s; }

.composer-foot, .vd-foot { display: flex; align-items: center; gap: 8px; margin-top: 8px; }

.ask-a p { margin: 0 0 8px; } .ask-a p:last-child { margin: 0; }
.ask-actions { display: flex; align-items: center; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--agent-line); background: var(--agent-bg); }
.sim-tag { font: 600 10.5px var(--font-ui); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); }
.thinking { color: var(--ink-3); display: inline-flex; align-items: center; gap: 8px; }
.dots { display: inline-flex; gap: 3px; } .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--agent); animation: blink 1s infinite; } .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 50% { opacity: .2; } }
.dec-c { display: flex; align-items: center; gap: 9px; width: calc(100% - 120px); min-height: 32px; padding: 4px 12px; border-radius: 8px; border: 1px solid var(--agent-line); background: var(--surface); cursor: pointer; text-align: left; font-size: 13px; }

/* ---------- shared blocks ---------- */
.callout { display: flex; gap: 12px; padding: 12px 16px; border-radius: 12px; background: color-mix(in srgb, var(--att-medium) 9%, var(--surface)); border: 1px solid color-mix(in srgb, var(--att-medium) 30%, var(--line)); }

.decision { padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }

html, body { height: 100%; }
body { overflow: hidden; }

.app { display: grid; grid-template-rows: 54px minmax(0, 1fr); height: 100vh; }
.top { display: flex; align-items: center; gap: 12px; padding: 0 12px 0 18px; border-bottom: 1px solid var(--line); background: var(--surface); }
.top-title { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.path-chip { font: 500 12px var(--font-mono); padding: 2px 7px; border-radius: 6px; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 320px; }
.count-pill { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line-2); background: var(--surface); font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.count-pill.on { background: var(--surface-3); color: var(--ink); }
.count-pill .n { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--ink); color: var(--bg); font-size: 11px; display: grid; place-items: center; }
.body { display: grid; grid-template-columns: 240px minmax(0, 1fr) 0; min-height: 0; transition: grid-template-columns .2s var(--ease); }
.body.panel { grid-template-columns: 240px minmax(0, 1fr) 360px; }
.stage { overflow: auto; position: relative; }

/* outline */
.outline { overflow: auto; padding: 18px 10px 90px; border-right: 1px solid var(--line); }

.o-item.d4 { padding-left: 34px; font-size: 12.5px; }
.o-item:hover { background: var(--surface-3); color: var(--ink); }
.o-item.on { color: var(--ink); background: var(--surface); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); }
.o-item .o-n { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--k-change); }

/* document */
.paper { max-width: 800px; margin: 28px auto 160px; padding: 44px 64px 56px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
.agent-line { display: flex; gap: 10px; align-items: flex-start; margin: -6px 0 26px; padding: 10px 14px; border-radius: 12px; background: var(--agent-bg); border: 1px solid var(--agent-line); font-size: 14px; line-height: 1.55; color: var(--ink-2); }
.agent-line .ic { color: var(--agent); margin-top: 3px; width: 13px; height: 13px; }
.doc { font-size: 16px; line-height: 1.75; color: var(--ink); }
.blk { position: relative; }
.blk > :first-child { margin-top: 0; }
.blk > :last-child { margin-bottom: 0; }
.blk + .blk { margin-top: 16px; }
.gut { position: absolute; left: -46px; top: 2px; display: flex; flex-direction: column; gap: 4px; opacity: 0; transition: opacity .12s; }
.blk:hover .gut { opacity: 1; }
.gut button { width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-3); cursor: pointer; display: grid; place-items: center; padding: 0; }
.gut button:hover { color: var(--ink); border-color: var(--ink-4); }
.gut .ic { width: 13px; height: 13px; }
.doc h1 { font-size: 34px; line-height: 1.18; letter-spacing: -.025em; font-weight: 720; margin: 0 0 12px; }
.doc h2 { font-size: 23px; line-height: 1.3; letter-spacing: -.015em; font-weight: 680; margin: 34px 0 6px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.doc h3 { font-size: 18px; font-weight: 660; margin: 22px 0 4px; }
.doc h4 { font-size: 15px; font-weight: 660; margin: 18px 0 4px; }
.doc p { margin: 0; }
.doc a { color: var(--accent); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 35%, transparent); text-underline-offset: 3px; }
.doc ul, .doc ol { margin: 0; padding-left: 26px; }
.doc li { margin: 4px 0; }
.doc li > ul, .doc li > ol { margin: 2px 0; }
.doc li:has(> input[type="checkbox"]) { list-style: none; margin-left: -22px; }

.doc code { font: .86em var(--font-mono); background: var(--code-bg); padding: 1px 5px; border-radius: 5px; }
.doc pre { position: relative; margin: 0; padding: 16px 18px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); font: 13px/1.65 var(--font-mono); white-space: pre; overflow-x: auto; }
.doc pre code { background: none; padding: 0; font-size: inherit; }

.doc blockquote { margin: 0; padding: 4px 18px; border-left: 3px solid var(--line-2); color: var(--ink-2); }
.doc table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.doc th, .doc td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.doc th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); font-weight: 650; border-bottom-color: var(--line-2); }
.doc hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0; }
.alert { padding: 12px 16px; border-radius: 12px; border: 1px solid var(--a-line); background: var(--a-bg); }
.alert .alert-t { display: flex; align-items: center; gap: 7px; font: 650 12.5px var(--font-ui); letter-spacing: .03em; text-transform: uppercase; color: var(--a-ink); margin-bottom: 4px; }
.alert .alert-t .ic { width: 14px; height: 14px; }

.alert.note { --a-ink: var(--accent); --a-bg: var(--accent-bg); --a-line: color-mix(in srgb, var(--accent) 30%, var(--line)); }
.alert.warning { --a-ink: var(--att-medium); --a-bg: color-mix(in srgb, var(--att-medium) 9%, var(--surface)); --a-line: color-mix(in srgb, var(--att-medium) 32%, var(--line)); }
.alert.important { --a-ink: var(--agent); --a-bg: var(--agent-bg); --a-line: var(--agent-line); }
.mermaid-box { display: grid; place-items: center; padding: 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); overflow-x: auto; }

.tk-k { color: var(--tk-k); } .tk-s { color: var(--tk-s); } .tk-n { color: var(--tk-n); } .tk-t { color: var(--tk-t); } .tk-f { color: var(--tk-f); } .tk-c { color: var(--tk-c); font-style: italic; }

/* annotations in the text */
mark.an { color: inherit; padding: 1px 0; border-radius: 3px; cursor: pointer; transition: background .15s, box-shadow .15s; }

mark.an.ask { background: var(--agent-bg); box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--agent) 55%, transparent); }

@keyframes flash { 0%, 40% { background: color-mix(in srgb, var(--accent) 40%, transparent); } }
.deco-ins { background: var(--add-strong); color: var(--add-ink); border-radius: 3px; padding: 1px 2px; margin-left: 2px; text-decoration: none; }
.deco-badge { display: inline-block; font-size: 12px; line-height: 1; padding: 2px 5px; margin-left: 3px; border-radius: 99px; background: var(--surface-3); vertical-align: 1px; cursor: pointer; }
.blk.block-noted::before { content: ""; position: absolute; left: -16px; top: 2px; bottom: 2px; width: 3px; border-radius: 3px; background: var(--att-medium); }
.blk.edited::before { content: ""; position: absolute; left: -16px; top: 2px; bottom: 2px; width: 3px; border-radius: 3px; background: var(--add-ink); }
.edit-tag { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 12.5px; color: var(--add-ink); font-weight: 600; }
.src-diff { margin-top: 8px; border-radius: 10px; border: 1px solid var(--line); overflow: hidden; font: 12.5px/1.6 var(--font-mono); }
.src-diff div { padding: 0 12px; white-space: pre-wrap; }
.src-diff .a { background: var(--add-bg); color: var(--add-ink); }
.src-diff .d { background: var(--del-bg); color: var(--del-ink); }
.block-editor textarea { font: 13.5px/1.6 var(--font-mono); min-height: 120px; }
.block-editor .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }

/* floating toolbar and popovers */
.tbar { position: fixed; z-index: 40; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 12px; background: #141414; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); animation: pop .14s var(--ease); }
.tbar button { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #eee; font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.tbar button:hover { background: #2b2b2b; }
.tbar .sep { width: 1px; height: 18px; background: #333; margin: 0 2px; }
.tbar .ic { width: 14px; height: 14px; }
.tbar .hint { color: #888; font-size: 11px; padding: 0 6px 0 2px; white-space: nowrap; }
.tbar button.main { background: #f2f2f2; color: #111; }
.tbar button.main:hover { background: #fff; }
.tbar button.icon { width: 30px; padding: 0; justify-content: center; font-size: 14px; }
.pop { position: fixed; z-index: 41; width: 380px; padding: 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line-2); box-shadow: var(--shadow-lg); animation: pop .14s var(--ease); }
.pop .quote { font-size: 12.5px; color: var(--ink-3); border-left: 2px solid var(--line-2); padding-left: 8px; margin: 0 0 8px; max-height: 60px; overflow: hidden; }
.pop-h { display: flex; align-items: center; gap: 8px; font: 600 12px var(--font-ui); color: var(--ink-2); margin-bottom: 8px; }
.pop-h .ic { width: 13px; height: 13px; }
.pop .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.pop .answer { font-size: 14px; line-height: 1.6; padding: 10px 12px; border-radius: 10px; background: var(--agent-bg); border: 1px solid var(--agent-line); margin-top: 8px; }
@keyframes pop { from { opacity: 0; transform: translateY(4px) scale(.98); } }

/* annotations panel */
.panel { overflow: auto; border-left: 1px solid var(--line); background: var(--surface); padding: 0 14px 90px; }
.panel-h { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 14px 0 10px; background: var(--surface); }
.panel-h h3 { margin: 0; font-size: 14px; font-weight: 650; }
.an-card { display: grid; gap: 6px; width: 100%; text-align: left; padding: 11px 12px; margin-bottom: 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-size: 13.5px; line-height: 1.5; }
.an-card:hover { border-color: var(--line-2); }
.an-card .t { display: flex; align-items: center; gap: 7px; font: 650 11px var(--font-ui); letter-spacing: .04em; text-transform: uppercase; }
.an-card .t .ic { width: 12px; height: 12px; }
.an-card .t.comment { color: var(--att-medium); } .an-card .t.delete, .an-card .t.suggest { color: var(--del-ink); } .an-card .t.label { color: var(--k-question); } .an-card .t.ask { color: var(--agent); } .an-card .t.edit { color: var(--add-ink); } .an-card .t.global { color: var(--ink-2); }
.an-card .q { color: var(--ink-3); font-size: 12.5px; border-left: 2px solid var(--line-2); padding-left: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.an-card .rep ins { text-decoration: none; background: var(--add-strong); border-radius: 3px; padding: 0 2px; }
.panel .empty { padding: 30px 8px; text-align: center; color: var(--ink-3); font-size: 13.5px; line-height: 1.6; }
.av { width: auto; height: 18px; padding: 0 6px; border-radius: 99px; background: var(--ink); color: var(--bg); font: 700 10px/18px var(--font-ui); flex: none; }
.loading { padding: 80px; text-align: center; color: var(--ink-3); }

/* ================================================================ ledger task review (round 1) */
.body { grid-template-columns: 290px minmax(0, 1fr) 0; }
.body.panel { grid-template-columns: 290px minmax(0, 1fr) 380px; }
.status-chip { display: inline-flex; align-items: center; gap: 6px; font: 600 11.5px var(--font-ui); padding: 3px 9px; border-radius: 99px; color: var(--st); background: color-mix(in srgb, var(--st) 12%, transparent); white-space: nowrap; }
.status-chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* status colours */
.s-done { --st: var(--pass); }
.s-progress { --st: var(--att-medium); }
.s-frontier { --st: var(--accent); }
.s-blocked { --st: var(--ink-4); }
.s-task { --st: var(--accent); }

/* bundle tree */
.tree { overflow: auto; padding: 12px 10px 90px; border-right: 1px solid var(--line); }
.t-sec { display: flex; align-items: center; gap: 6px; font: 600 11px var(--font-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin: 16px 10px 6px; }
.t-row { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 30px; text-align: left; padding: 5px 10px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; font-size: 13.5px; color: var(--ink-2); line-height: 1.35; }
.t-row:hover { background: var(--surface-3); color: var(--ink); }
.t-row.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); }
.t-row .fi { width: 15px; height: 15px; color: var(--ink-3); }

.t-row.in1 { padding-left: 22px; }

.t-tid { font: 600 11.5px var(--font-mono); color: var(--ink-3); flex: none; width: 18px; }
.t-row.on .t-tid { color: var(--ink); }
.st-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--st); box-shadow: 0 0 0 3px color-mix(in srgb, var(--st) 16%, transparent); }
.s-blocked .st-dot, .st-dot.s-blocked { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-4); }
.t-meta { font-size: 11px; color: var(--ink-4); flex: none; font-variant-numeric: tabular-nums; }

.t-sub { display: block; width: 100%; text-align: left; border: 0; background: none; cursor: pointer; padding: 4px 10px 4px 40px; font-size: 12.5px; color: var(--ink-3); line-height: 1.35; border-radius: 6px; position: relative; }

.t-sub.on { color: var(--ink); }

.t-sub .o-n { margin-left: 6px; }
.t-folder .chev { margin-left: -2px; }
.t-more { font-size: 12px; color: var(--ink-3); padding: 4px 10px 4px 36px; }
.t-keys { margin: 18px 10px 0; display: grid; gap: 6px; font-size: 12px; color: var(--ink-3); }

/* stage */
.wide { max-width: 1080px; margin: 0 auto; padding: 28px 36px 160px; }
.ov-k { font: 600 11.5px var(--font-mono); color: var(--ink-3); margin-bottom: 8px; }
.ov-title { font-size: 32px; line-height: 1.18; letter-spacing: -.025em; font-weight: 720; margin: 0 0 10px; }
.ov-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; color: var(--ink-3); font-size: 13px; margin-bottom: 22px; }
.ov-intent { position: relative; padding: 20px 24px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 15px; line-height: 1.7; margin-bottom: 18px; }
.ov-intent p { margin: 0; } .ov-intent p + p { margin-top: 10px; }

.ov-intent .fade { max-height: 168px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
.card-k { display: flex; align-items: center; gap: 10px; font: 600 11px var(--font-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 10px; }

/* ticket graph */
.graph-card { padding: 20px 24px 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); margin-bottom: 18px; }
.gc-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }

.legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-3); margin-left: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.checks { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--pass); font-weight: 550; }
.checks .ic { width: 14px; height: 14px; }
.checks.bad { color: var(--fail); }
.problems { margin: 10px 0 0; padding: 10px 14px; border-radius: 10px; background: color-mix(in srgb, var(--fail) 7%, var(--surface)); border: 1px solid color-mix(in srgb, var(--fail) 28%, var(--line)); font-size: 13px; display: grid; gap: 4px; }

.graph-wrap { overflow-x: auto; margin: 14px -24px 0; padding: 6px 24px 10px; }

.edge { fill: none; stroke: var(--line-2); stroke-width: 1.6; transition: opacity .15s, stroke .15s; }

.edge.done { stroke: color-mix(in srgb, var(--pass) 50%, var(--line-2)); }

.node { position: absolute; display: grid; gap: 7px; align-content: start; text-align: left; padding: 11px 13px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); cursor: pointer; transition: opacity .15s, transform .15s, border-color .15s, box-shadow .15s; }
.node:hover { transform: translateY(-1px); border-color: var(--line-2); }
.node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.node.s-frontier { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); box-shadow: 0 0 0 4px var(--accent-bg), var(--shadow); }
.node.s-done { background: color-mix(in srgb, var(--pass) 4%, var(--surface)); }
.node.s-blocked .n-title { color: var(--ink-2); }
.graph.hovering .node { opacity: .38; }
.graph.hovering .node.hot { opacity: 1; }
.n-top { display: flex; align-items: center; gap: 8px; font-size: 11.5px; }
.n-id { font: 650 12px var(--font-mono); color: var(--ink-2); }
.n-st { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--st); }
.n-st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-blocked .n-st { color: var(--ink-3); }
.s-blocked .n-st::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-4); }
.n-an { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-weight: 700; color: var(--k-change); }

trap-benchmark-20261004-171429/tags-case-dedupe/search+challengers/3-bs-20261004-183305-d8ff/record.json", "bytes": 15234, "source": null}, {"path": "evaluation/trap-benchmark-20261004-171429/tags-case-dedupe/search+challengers/3-bs-20261004-183305-d8ff/spec.json", "bytes": 4215, "source": null}, {"path": "evaluation/trap-benchmark-20261004-171429/tags-case-dedupe/search+challengers/4-bs-20261004-183808-1458/record.json", "bytes": 15215, "source": null}, {"path": "evaluation/trap-benchmark-20261004-171429/tags-case-dedupe/search+challengers/4-bs-20261004-183808-1458/spec.json", "bytes": 3680, "source": null}, {"path": "evaluation/trap-benchmark-20261004-171429/tags-case-dedupe/search+challengers/5-bs-20261004-184033-ee6f/record.json", "bytes": 16427, "source": null}, {"path": "evaluation/trap-benchmark-20261004-171429/tags-case-dedupe/search+challengers/5-bs-20261004-184033-ee6f/spec.json", "bytes": 3944, "source": null}, {"path": "evaluation/trap-benchmark-20261004-171429/tags-case-dedupe/search/1-bs-20261004-182306-6849/record.json", "bytes": 13340, "source": null}, {"path": "evaluation/trap-benchmark-20261004-171429/tags-case-dedupe/search/1-bs-20261004-182306-6849/spec.json", "bytes": 3629, "source": null}, {"path": "evaluation/trap-benchmark-20261004-171429/tags-case-dedupe/search/2-bs-20261004-182831-1961/record.json", "bytes": 13355, "source": null}, {"path": "evaluation/trap-benchmark-20261004-171429/tags-case-dedupe/search/2-bs-20261004-182831-1961/spec.json", "bytes": 3833, "source": null}, {"path": "evaluation/trap-benchmark-20261004-171429/tags-case-dedupe/search/3-bs-20261004-183248-b5e5/record.json", "bytes": 12661, "source": null}, {"path": "evaluation/trap-benchmark-20261004-171429/tags-case-dedupe/search/3-bs-20261004-183248-b5e5/spec.json", "bytes": 3720, "source": null}, {"path": "evaluation/trap-benchmark-20261004-171429/tags-case-dedupe/search/4-bs-20261004-183609-f68f/record.json", "bytes": 12674, "source": null}, {"path": "evaluation/trap-benchmark-20261004-171429/tags-case-dedupe/search/4-bs-20261004-183609-f68f/spec.json", "bytes": 3457, "source": null}, {"path": "evaluation/trap-benchmark-20261004-171429/tags-case-dedupe/search/5-bs-20261004-183914-2cf3/record.json", "bytes": 12322, "source": null}, {"path": "evaluation/trap-benchmark-20261004-171429/tags-case-dedupe/search/5-bs-20261004-183914-2cf3/spec.json", "bytes": 3765, "source": null}, {"path": "evaluation/traps-balanced.json", "bytes": 1060, "source": "{\n  \"model\": \"balanced\",\n  \"traps\": [\n    \"config-deep-merge\",\n    \"slugify-diacritics\",\n    \"tags-case-dedupe\"\n  ],\n  \"runsPerArm\": 5,\n  \"concurrency\": 3,\n  \"oracle\": {\n    \"timeoutSec\": 60\n  },\n  \"search\": {\n    \"passive\": {\n      \"enabled\": false,\n      \"repeatThreshold\": 3\n    },\n    \"enumerate\": {\n      \"count\": 4\n    },\n    \"branches\": {\n      \"perGeneration\": 3,\n      \"maxTotal\": 6\n    },\n    \"generations\": {\n      \"maxDepth\": 1,\n      \"rootsPerGeneration\": 1,\n      \"parentsPerGeneration\": 1,\n      \"childrenPerParent\": 2\n    },\n    \"branch\": {\n      \"limits\": {\n        \"wallClockSec\": 900,\n        \"outputTokens\": 40000\n      }\n    },\n    \"scorer\": {\n      \"validationRetries\": 1,\n      \"challengers\": 2\n    },\n    \"constraints\": [\n      \"Add no new dependencies.\",\n      \"Change as few files as possible.\",\n      \"Delete or simplify existing code before you add code.\",\n      \"Write a failing test that reproduces the problem before you change any source file.\"\n    ],\n    \"workspace\": {\n      \"cloneIgnored\": []\n    },\n    \"apply\": \"auto\"\n  }\n}"}, {"path": "retrospective.md", "bytes": 915, "source": "Status: complete\nCreated: 2026-10-04\nUpdated: 2026-10-04\n\n# Retrospective\n\n## What Mattered\n\n- The benchmark answered the real question in 91 minutes for about $12: with explicit goals, a single agent solves the traps, so search had no headroom.\n- Scorer kill rate on known-wrong solutions was 100% with or without challengers; the authored checks were not the limit on these traps, their blind spots were (the slugify misses).\n\n## Learnings\n\n- Benchmark tasks must include ones where a single run actually fails; otherwise only cost can show.\n- A judge written by the same model as the attempts cannot select for what that model misses.\n- Smallest-diff tie-breaks prefer the less complete of two survivors under incomplete checks.\n- The eval harness hid catalog-only models until the downloaded catalog was copied into its isolated state.\n\n## Improvements\n\n- Run a cheap end-to-end demo before ticketing a design.\n"}, {"path": "task.md", "bytes": 5510, "source": "Status: done\nCreated: 2026-10-04\nUpdated: 2026-10-04\n\n# Branch search: adversarial scorer and trap benchmark\n\n## Intent\n\nThe slugify demo (2026-10-04; a throwaway repository, not kept: `slugify` keeps every script, and the goal is to turn Latin letters with diacritics into ASCII) showed that the search works live in about 6 minutes, but its authored checks missed ligatures (`\u00e6`, `\u00df`, `\u0153`). No attempt died, and the search beat the agent alone by luck. The checks are the weak link. This task makes the checks adversarial and measures, on fast staged traps, whether search beats one trajectory.\n\nPrior work: `.ledger/history/202610031403-branch-search/` (spec, tickets, pilot evaluation). Product behavior: `docs/branch-search.md`.\n\n## Approach (draft)\n\n1. **Challenger pass.** After the authored scorer validates, one or more challenger forks each write a plausible but wrong implementation of the goal in a base worktree, and name the defect they planted. Challengers never see the checks. The harness runs the gates on each challenger implementation. A challenger that passes every gate exposes a gap: the author gets the challenger's diff and defect claim, adds a check, and validation must then show the new check fails on the base and on that challenger implementation. Challenger content never reaches branches (phase separation, spec 8.4). The record keeps each challenger's diff, claim, and whether the gates caught it. The number of challengers is a configuration key with no built-in value.\n2. **Trap benchmark.** 3 to 5 staged traps checked into the repo: each a tiny repository, a goal, and an oracle test that runs in seconds. In each, the obvious fix passes the visible tests but fails a hidden case. Arms: agent alone (framed like a branch directive), search, and search with challengers. Each arm runs N times per trap, in parallel. The report gives per trap and arm the solve rate, median time, and cost, plus how often the authored checks killed a known-wrong reference implementation stored with the trap.\n\n## Acceptance criteria (draft)\n\n- With challengers configured, a challenger implementation that passes every gate makes the author add a check, and the frozen scorer fails on that implementation. A test proves it with scripted replies.\n- No challenger diff, claim, or check content appears in any branch prompt or on disk while a branch runs.\n- Each trap's known-wrong reference implementation fails its oracle and passes its visible tests; its correct reference passes both.\n- The benchmark command runs all arms N times per trap and writes one report with solve rate, median time, cost, and the scorer-kill rate per arm.\n- The first benchmark report exists in this bundle.\n\n## Decisions (operator, 2026-10-04)\n\n- First benchmark: 3 traps, 5 runs per arm (45 runs; roughly $10-20).\n- 2 challenger forks per search; `branch-search.example.json` gets the same value.\n- Win bar, fixed before the run: search with challengers solves at least 20 percentage points more trap runs than the agent alone, over all traps.\n\n## Current State\n\nTickets 01-04 done. First benchmark (2026-10-04, `evaluation/trap-benchmark-20261004-171429.md`, operator chose the `balanced` profile, openai/gpt-6.1-sol, medium): 45 of 45 runs, about $12 estimated, 91 minutes.\n\n- Solved: alone 15 of 15, search 13 of 15, search+challengers 14 of 15. Win bar not met (-7 points against +20).\n- Scorer kill rate on the known-wrong solutions: 100% in both search arms.\n- Cost: search arms about 5x the tokens and 3-4x the wall-clock of the agent alone.\n- All search misses were on slugify: two survivors passed the authored checks with nearly equal diffs, and the smaller one missed hidden cases; one search had no survivor.\n- Reading: the goals state every requirement the oracle checks, so a careful single agent solved everything; the benchmark had no headroom for search to show a gain. The smallest-diff tie-break can prefer the less complete of two survivors when the checks miss a case.\n\n- 01 `fbe4e45` (+ `586b270`): challenger pass. Decisions in review: an open gap after the repair rounds ends `aborted: scorer invalid`; the author may dismiss a claimed defect with a recorded reason; author and challenger forks write git objects to a private store; scorer-phase refs are restored except changes whose objects the shared store holds (user work). A ref deleted during the phase is recreated. Documented residuals: a fork that deliberately bypasses the private store; a user stash pushed on top of a challenger stash in the same phase leaves the challenger's entry.\n- 02 `ecebfa0` (+ `edf6af1`): traps slugify-diacritics (input coverage), config-deep-merge (regression), tags-case-dedupe (performance).\n- 03 `7137f2c`: `npm run eval:traps` with `BRANCH_SEARCH_TRAPS_CONFIG` and `BRANCH_SEARCH_TRAPS_OUT`; example `components/branch-search/eval/traps.example.json`. A shared launcher (`scripts/eval-run.mjs`) owns cancellation for both evaluation commands.\n- Cost: the builder estimates about 1,800 requests for 45 runs, roughly $40-150 on an Opus-class profile, well above the planned $10-20.\n\n## Outcome\n\nWin bar not met; the agent alone solved every trap. Conclusion with the operator (2026-10-04): a model-authored scorer shares the attempts' blind spots, so the authored-scorer path adds cost without value; branching stays only for user-defined scalar judges. Branch search is to be simplified, and the follow-up idea moved to `.ledger/202610041515-repository-history-replay/` (see its `notes.md`).\n"}, {"path": "tickets/01-challenger-pass.md", "bytes": 1903, "source": "# 01: Challenger pass\n\n**What to build:** When the configuration sets `scorer.challengers`, the search attacks its own authored checks before any attempt runs. That many challenger forks each write a plausible but wrong solution to the goal in a copy of the base, and state the defect they planted; they never see the checks. The harness runs the gates on each challenger solution. A challenger solution that passes every gate exposes a gap: the author receives that solution's diff and stated defect, adds or sharpens a check, and the scorer is validated again, which now also requires that the gates reject that challenger solution. Only then does the scorer freeze and the enumerator start. Challenger content stays out of every attempt's reach, like the rest of the scorer. The record keeps each challenger's diff, stated defect, and whether the gates caught it. `branch-search.example.json` sets 2 challengers, and the branch-search docs describe the pass.\n\n**Blocked by:** None (can start immediately).\n\n**Status:** ready-for-agent\n\n- [ ] With challengers configured and scripted replies, a challenger solution that passes every authored gate sends the author its diff and stated defect, and the frozen scorer's gates reject that challenger solution.\n- [ ] A challenger solution that the authored gates already reject causes no author round, and the record marks it caught.\n- [ ] Without `scorer.challengers`, no challenger fork starts and no challenger request is sent.\n- [ ] No challenger diff, stated defect, or check content appears in any enumerator or attempt request, or on disk while an enumerator or attempt runs.\n- [ ] The record holds each challenger's diff, stated defect, and caught or not, and its token cost counts in the search's cost.\n- [ ] `branch-search.example.json` passes the configuration validator with 2 challengers, and the docs describe the challenger pass and its key.\n"}, {"path": "tickets/02-trap-puzzles.md", "bytes": 1053, "source": "# 02: Three trap puzzles with reference solutions\n\n**What to build:** Three staged trap puzzles checked into the repository for the benchmark: the slugify diacritics puzzle from the 2026-10-04 demo plus two new kinds of trap. Each puzzle is a tiny repository with a goal text, visible tests, a hidden oracle test that runs in seconds, a known-wrong solution (the obvious fix that passes the visible tests), and a known-right solution. A check proves each puzzle is a real trap.\n\n**Blocked by:** None (can start immediately).\n\n**Status:** ready-for-agent\n\n- [ ] For every puzzle, the base fails the oracle, the known-wrong solution passes the visible tests and fails the oracle, and the known-right solution passes both; a test asserts all three.\n- [ ] Every puzzle's oracle runs in under 5 seconds and needs no network or package install.\n- [ ] The three puzzles trap in different ways (not three variants of one input-coverage gap), and each puzzle's goal names only interfaces an attempt can know.\n- [ ] The puzzles stay out of the published package.\n"}, {"path": "tickets/03-benchmark-runner.md", "bytes": 1681, "source": "# 03: Benchmark runner and report\n\n**What to build:** One command runs the trap benchmark: for each puzzle, each arm runs N times in parallel, each run in a fresh copy of the puzzle. The arms are the agent alone (prompted to work until done, like an attempt directive), search, and search with challengers. Every final state is scored with the puzzle's oracle. Separately, each search's frozen checks are run against the puzzle's known-wrong solution to measure whether they kill it. The command writes one report: per puzzle and arm the solve rate, median time, and cost; the scorer kill rate per search arm; overall solve rates; and whether the win bar holds (search with challengers solves at least 20 percentage points more runs than the agent alone over all puzzles). Run count, model, and search configuration come from an operator-supplied file; nothing is built in.\n\n**Blocked by:** 01 (Challenger pass), 02 (Three trap puzzles with reference solutions).\n\n**Status:** ready-for-agent\n\n- [ ] With the fake model and scripted replies, the command runs all three arms N times on each puzzle in fresh copies and scores every final state with that puzzle's oracle.\n- [ ] The report lists per puzzle and arm the solve rate, median time, and cost, the scorer kill rate on the known-wrong solution for each search arm, and the win-bar verdict computed from the overall solve rates.\n- [ ] A missing configuration file or key prints what to fix and starts no model request.\n- [ ] Cancelling the command stops running arms, removes their copies, and writes the report of what finished.\n- [ ] The command never runs in the default test suite, and nothing it adds ships in the package.\n"}, {"path": "tickets/04-first-benchmark-run.md", "bytes": 689, "source": "# 04: First benchmark run\n\n**What to build:** Run the trap benchmark for real with the operator's decided scale (3 puzzles, 5 runs per arm, 3 arms) on the operator's chosen model, and store the report and its search records in this task bundle.\n\n**Blocked by:** 03 (Benchmark runner and report).\n\n**Status:** ready-for-agent\n\n- [ ] The report for 45 runs exists in this task bundle, with every arm's solve rate, median time, cost, and scorer kill rate.\n- [ ] The report states whether the win bar (+20 percentage points for search with challengers over the agent alone) holds.\n- [ ] The task records the total spend and any run that failed for a harness reason rather than a model reason.\n"}]}, "monty": {"id": "202609251319-monty-pi-exec", "path": ".ledger/202609251319-monty-pi-exec", "note": "Plan and tickets for the Monty rewrite. I need your sign-off on the slicing before I implement.", "files": [{"path": "plan.md", "bytes": 10742, "source": "# Plan: rebuild pi_exec on Monty\n\n## 1. What Monty is\n\n`@pydantic/monty` 1.0.0 (MIT, Node >= 20) is a Python 3.14 subset interpreter written in Rust. The Node binding is a napi addon that drives a pool of `monty` worker subprocesses. The sandbox has no filesystem, network, env, or process access. It reaches the host only through `externalLookup` functions and explicit mounts. Every host call is a suspension: the worker stops, the host answers, and the worker resumes.\n\nPlatforms: darwin x64/arm64, linux gnu x64/arm64, win32 x64 (no musl). Unpacked package is about 24 MB plus one platform binary. Pydantic AI \"Code Mode\" runs on it.\n\nCore API: `Monty.create(poolOpts)` \u2192 `pool.checkout({ limits, typeCheck, typeCheckStubs, osPolicy })` \u2192 `session.feedRun(code, { inputs, externalLookup, printCallback })`. Also `feedStart`/`snapshot.resume*`, `session.dump()` / `loadSession()` / `loadSnapshot()`.\n\n## 2. Proven by spike (`/tmp/monty-probe`, Node 26, macOS arm64)\n\n| Question | Result |\n| --- | --- |\n| Concurrent async host calls | `asyncio.gather` over 20 host calls of 50 ms each: 53 ms total, peak in-flight 20. The host sees every call at once, so the existing envelope can throttle it. |\n| Kwargs shape | Python `read(path=\"x\")` reaches the host as a trailing plain object `{ path: \"x\" }`. This maps 1:1 to our one-object tool args. |\n| Pre-flight type check | Stub `async def bash(*, command: str, ...)`. `bash(cmd=\"ls\")` is rejected before execution with ty diagnostics `missing-argument` / `unknown-argument`, including source spans. First check took 13.5 ms. A warm feed took 0.8 ms. |\n| Host error \u2192 Python | Setting JS `error.name = \"FileNotFoundError\"` gives a real Python exception and a clean traceback. |\n| Runaway compute | `while True: pass` with `maxTurnDurationSecs: 1` stops at 1000 ms with `TimeoutError`. |\n| Cancellation | `session.close()` during a pending host call does **not** settle the feed promise (it stays pending forever). Rejecting the pending host promise with `name = \"KeyboardInterrupt\"` ends the feed. `except Exception` does not catch it, because it is a BaseException. |\n| Output values | Python dicts return as JS `Map`, and tuples return as arrays. A deep converter is needed for the JSON boundary. |\n| Persistence | Session globals persist across feeds. A dump with a 1000-item list is 7.3 KB, and `loadSession` restores it into another worker. |\n| Latency | Warm checkout < 1 ms; cold checkout with a pre-spawned pool is 5 ms. The first run on this machine was about 600 ms, probably first-exec of the binary. |\n\n## 3. Why this is materially better (not only different)\n\n1. **Wrong calls fail before any side effect.** Today a typo in the arguments of the 5th call runs calls 1\u20134 (bash/edit/write) and fails mid-program. With Monty, one generated `.pyi` stub (from the same Typebox schemas that render the `code` parameter today) is checked by ty in milliseconds before execution. The stub is also the documentation. One source gives both the contract and the checker.\n2. **A real sandbox instead of hardening.** Node says `node:vm` \"is not a security mechanism\". We carry escape-hardening code and tests (\"blocks string-generated escapes\", \"keeps host promises hidden when guest intrinsics are modified\", \"does not expose Node globals\"). Monty isolates at the language level and puts the worker in a separate process. Memory, recursion, and time limits are enforced inside the VM.\n3. **We stop building a JS runtime.** Web polyfills (fetch/URL/Headers/Request/Response/AbortController/TextEncoder\u2026), timers, the worker message protocol, call ids, and the strict-JSON realm crossing all go away. Each guest capability becomes one async host function.\n4. **Python for orchestration code.** Comprehensions, sets, `collections`, `re`, `json`, `itertools`. `std.coverage` / `std.reconcile` become one-liners, and `parallel`/`pipeline` become `asyncio.gather` plus a plain loop.\n5. **Optional: a REPL that follows the session tree.** A session dump is a few KB. If we persist it as a Pi custom session entry after each call, variables survive across calls, restarts, and forks, and follow `/tree` navigation. This replaces the `state` ID store (in-memory, 200 KB, 32 snapshots, lost on restart).\n\n## 4. Honest limits and costs\n\n- **The language changes to Python.** This breaks every JS program: `.pi/programs/*.js`, skill references (`code-review/references/*.js`, `ralph/references/*.js`), and system-prompt examples. A dual runtime would be a compatibility layer, so the plan is a clean cut.\n- **The subset is small.** It has no class inheritance, no `create_task` / `Semaphore` / `as_completed` / `wait_for`, no `async for` / `async with`, no `enum`, `contextlib`, `hashlib`, or `uuid`, and no third-party imports. Orchestration code rarely needs these, and the type checker flags most of them before a run.\n- **No top-level `return`.** The result is the trailing expression (REPL semantics, as in Pydantic AI Code Mode). Wrapping the code in `async def main()` would keep `return` but loses REPL globals, so choose one.\n- **Some output values become strings.** Functions, classes, and regex patterns silently become strings on output. A strict converter can reject Map keys that are not strings, and Set, BigInt, and Buffer. It cannot see the stringified values.\n- **Cancellation is ours to own** (proven above). On abort, reject every pending host promise with KeyboardInterrupt. Later host calls reject immediately. Pure compute is bounded by `maxTurnDurationSecs`, with the pool `requestTimeout` as a kill backstop.\n- **`maxSuspensions` cannot be disabled** (default 1000). It counts calls and future resolutions, so it must be derived from `callBudget`, not guessed.\n- **A native dependency and a new 1.0.** Pin the exact version. `npm run pack:check` must show that the platform packages resolve through `optionalDependencies`.\n- **Code reduction is about 30%, not 70%.** Agents, UI, traces, the envelope, tool capture, and saved programs are harness semantics, and they stay.\n\n## 5. Size estimate (`extensions/runtime-*`, 4327 lines today)\n\n| Goes | Lines | Replacement | Lines (est.) |\n| --- | --- | --- | --- |\n| `runtime-worker.mjs` | 411 | `runtime-monty.ts`: pool lifecycle, feed drive, abort, converter | ~200 |\n| `runtime-web.mjs` | 705 | `fetch(url, method=, headers=, body=)` host function in `runtime-fetch.ts` | ~60 |\n| `runtime-program.ts` | 147 | (merged above) | 0 |\n| `runtime-json.ts` | 43 | (converter above) | 0 |\n| `runtime-stdlib.mjs` | 413 | host-side TS for git/repo/dev/context/schema; drop coverage/reconcile | ~250 |\n| `runtime-api.ts` JS signature formatter + ECMAScript list | ~200 | `.pyi` stub generator from Typebox | ~120 |\n| `state` store in `runtime-implementation.ts` | ~90 | none, or a dump entry if \u00a77 D2 is approved | 0\u201360 |\n\nNet: about \u22121300 lines of runtime, and about \u2212600 lines of VM/polyfill/escape tests in `tests/runtime.test.ts`.\n\n## 6. Guest surface (proposal)\n\nFlat async functions, named after the tools, with kwargs matching the tool schema:\n\n```python\nimport asyncio\nnames = [n for n in (await ls(path=\"extensions\")).splitlines() if n.endswith(\".ts\")]\n\nasync def judge(name):\n    r = await agent_run(\n        task=\"Name the riskiest export and quote the evidence.\",\n        name=name,\n        context={\"path\": f\"extensions/{name}\"},\n        output_schema=schema({\"export\": \"str\", \"evidence\": \"str\"}),\n    )\n    return {\"file\": name, \"status\": r[\"status\"], **(r.get(\"value\") or {})}\n\nawait asyncio.gather(*[judge(n) for n in names])\n```\n\n- Core: `read grep find ls bash edit write`. Extensions: `mcp(...)`, `ledger_add(...)`, \u2026 captured as today. `agent`/`agent_run`, `fetch`, `skills_list`/`skills_body`, and `std` functions as flat `git_change`, `context_fit`, and so on.\n- `inputs` are bound as the global `inputs`. `print` goes to a capped collector.\n- `limits.concurrency` is still enforced host-side (the gather fans out, the envelope queues).\n- `display` / `limits` stay tool parameters.\n\n## 7. Decisions for the operator\n\n- **D1 Language cut:** rewrite all JS programs to Python in one change, with no JS fallback (recommended), or keep both runtimes.\n- **D2 Persistence:** (a) stateless feeds plus the current `state` IDs; (b) one live Monty session per root session, dumped to the session JSONL after each call and restored on fork/tree/restart (recommended; it reverses the `prime-agent` \"persistent kernels\" rejection in `docs/boundaries.md`). The dump size policy needs an operator decision; no guessed cap.\n- **D3 Type check:** always on (recommended; this is the main correctness win), or opt-in.\n- **D4 boundaries.md:** the `pi-fabric` row rejects \"QuickJS/WASM, compile-time TypeScript checking, alternate runtimes\". Monty is a replacement runtime with compile-time checking, so the row must be rewritten.\n\n## 8. Phases (each ends green on `format:check lint typecheck test pack:check`)\n\n0. **Close the spike gaps.** Measure suspensions per host call. Measure ty latency with a full stub (about 40 extension tools). Check `maxMemory` behavior. Check `pack:check` and a checkout install of the platform packages. Check the 256 MiB dump and 10 MiB print caps.\n1. **Tracer bullet.** `runtime-monty.ts` behind the existing `pi_exec` tool: core tools, `agent`/`agent_run`, and extension tools as host functions; the stub generator; abort; the converter. Delete worker/web/program/json. Rewrite the runtime tests that assert tool behavior (budget, concurrency, traces, cancel, errors, saved programs).\n2. **Library and callers.** Move std to the host side (drop coverage/reconcile). Rewrite the skill reference programs and saved-program discovery (`.py`, docstring/`@param` header). Update the system-prompt guidance and examples in `runtime-api.ts`.\n3. **Persistence** (if D2b). Custom entry per call, restore on `session_start`/fork/tree, remove the `state` parameter and store.\n4. **Documentation.** `docs/exec.md`, `docs/boundaries.md`, `README.md`, the AGENTS.md execution-context paragraph, `THIRD_PARTY_NOTICES.md`.\n\n## 9. Acceptance criteria\n\n- The same observable `pi_exec` behavior that the retained tests assert: envelope, fan-out queueing, traces, usage, cancellation, saved-program tools, and the search root guard on core tools.\n- A program with a wrong keyword argument fails with a ty diagnostic, and zero host calls are dispatched.\n- Abort during a pending host call ends the program within one host round trip. Runaway compute ends at the turn limit.\n- `extensions/runtime-*` is smaller by at least 1000 lines, and there are no Node-VM escape tests left, because there is no Node VM.\n- `pack:check` lists `@pydantic/monty` with platform optional dependencies, and the loader test passes.\n"}, {"path": "retrospective.md", "bytes": 1197, "source": "Status: done\nCreated: 2026-09-25\nUpdated: 2026-09-27\n\n# Retrospective\n\n## What Mattered\n\nThe type-checker, host-call budgets, and Pi session tree had to remain one coherent execution boundary. Public tests through the registered tool caught failures that a standalone Monty probe did not: cross-feed typing, branch restore, authenticated reload, terminal rollback, and cancellation of gathered host work.\n\n## Learnings\n\nMonty infers an unannotated global such as `x = 1` as a literal type; annotate `x: int` if later feeds will assign other integers. Its suspension limit accumulates per checkout, so rotate from the last checkpoint before host-call usage reaches the limit. `session.close()` alone does not interrupt an in-flight feed; abort pending host calls, stop the active worker, and await cleanup. Session JSONL can be imported, so verify a dump's authentication and stub compatibility before calling Monty's `loadSession`.\n\n## Improvements\n\nA public Monty worker-termination API would remove the need to stop the owned in-flight worker by its captured PID. Until then, restrict that fallback to a feed known to be in flight and keep the timeout, rollback, and orphan-process regressions.\n"}, {"path": "task.md", "bytes": 1744, "source": "Status: done\nCreated: 2026-09-25\nUpdated: 2026-09-27\n\n# Replace pi_exec JavaScript VM with Monty Python sandbox\n\n## Intent\n\nReplace the node:vm JavaScript guest of `pi_exec` with a Monty Python sandbox. Keep the harness semantics (envelope, agents, traces, UI, saved programs) and remove the self-built JS runtime.\n\n## Current State\n\nResearch and spike done; see `plan.md`. Operator decisions (2026-09-25):\n\n- D1: clean rewrite to Python, no JS fallback.\n- D2: one live session per root session, with a way to reset it and to recover it when a bound is hit.\n- D3: type checking always on.\n- D4: rewrite the `pi-fabric` row in `docs/boundaries.md`.\n\nTickets 01\u201306 are complete. The tree and `reset` are the only restore points; Monty's own dump limit is the only size bound. Spike scripts live in `/tmp/monty-probe` (not in the repo).\n\n## Outcome\n\n`pi_exec` now runs type-checked Monty Python with core and extension tools, model workers, HTTP, evidence helpers, and typed saved programs. One live interpreter follows the root Pi session tree; authenticated checkpoints restore after reload and navigation. Terminal failures report rollback without claiming to undo completed external effects. Python review and Ralph programs replace the JavaScript references. The prior Node VM and explicit JSON state IDs are removed. See each ticket for acceptance evidence and `docs/exec.md` for the user contract.\n\nValidation on 2026-09-27: format check, lint, typecheck, 1,096 unit tests, 121 pair checks, package-loader smoke, package dry-run, and an extracted-tarball loader smoke passed. An isolated offline tarball install was blocked by an uncached transitive dependency; the extracted tarball loaded against the checkout's installed dependencies.\n"}, {"path": "tickets/01-python-programs-on-monty.md", "bytes": 2686, "source": "# 01: Python programs run on Monty with the core tools\n\n**What to build:** `pi_exec` runs Python in a Monty sandbox instead of JavaScript in a Node VM. A program is Python with top-level `await`, and its result is the value of the last expression. The core tools `read grep find ls bash edit write` are async functions whose keyword arguments match the parent tool schemas. Their signatures are generated from those schemas: they render the live `code` parameter contract and also feed the Monty type checker, which is always on, so a wrong call fails before any host call runs. The harness semantics stay: the call budget, concurrency queueing (a gathered fan-out waits on the host side), the wall deadline, abort, durable nested traces, capped `print` output, `inputs`, `display`, `limits`, and a strict JSON result (Python dicts return as JS `Map` and must be converted, and lossy values are rejected). Cancellation belongs to the host: on abort, reject every pending host call with a `KeyboardInterrupt`-named error. The spike showed that `session.close()` does not settle a pending feed. Derive Monty's suspension limit from the call budget, not from a guess. The JavaScript worker, the web polyfills, the realm-crossing JSON code, and the VM-escape tests are deleted, with no JS fallback. This ticket also adds the pinned dependency, records its provenance, rewrites the `pi-fabric` row in the boundaries document, and updates the exec documentation and system-prompt guidance for the Python core surface. Model workers, extension tools, fetch, std, saved programs, and persistence follow in later tickets.\n\n**Blocked by:** None (can start immediately).\n\n**Status:** done\n\n- [x] A program with a wrong keyword argument to a core tool fails with a type diagnostic that names the argument, and its trace records zero host calls.\n- [x] `asyncio.gather` over more core-tool calls than `limits.concurrency` completes with every result, and the observed peak of calls in flight equals the limit.\n- [x] Abort during a pending `bash` call ends the program promptly with a cancelled result. A bare `except Exception` in the program does not stop it.\n- [x] `while True: pass` stops at the configured deadline with a timeout error, and the next `pi_exec` call succeeds.\n- [x] A returned dict, list, and nested structure appear as plain JSON in the tool result. A returned set, or a dict with non-string keys, fails with a boundary error.\n- [x] A program that uses a JavaScript global such as `setTimeout` or `pi.read` fails with a Python `NameError` or a type diagnostic.\n- [x] `npm run pack:check` lists the Monty package, the loader test passes, and the full validation sequence is green.\n"}, {"path": "tickets/02-model-workers-from-python.md", "bytes": 1397, "source": "# 02: Model workers from Python\n\n**What to build:** Python programs can start model workers with `agent(...)` (returns text, or the typed value when `output_schema` is set) and `agent_run(...)` (returns status, text, value, error, usage, and context-fit info, and does not raise on failure). The options are the same as today: task, type, name, profile, tools, pair, system prompt, context, output schema. A `schema(...)` shorthand compiles strict JSON Schema from terse shapes. Bound context is still attached as a file, not interpolated into the task. Worker usage is aggregated into the outer tool result, and nested worker tool calls stay in the trace. The signatures are part of the type-checked contract. The exec documentation and prompt examples show the gather-based fan-out pattern.\n\n**Blocked by:** 01: Python programs run on Monty with the core tools.\n\n**Status:** done\n\n- [x] A gathered fan-out of three `agent_run` calls with an `output_schema` returns three values that match the schema.\n- [x] One worker that fails returns `status: \"failed\"` with an error, and its siblings still return values.\n- [x] `agent(...)` with an `output_schema` returns the typed value itself, and without one returns text.\n- [x] The usage in the outer tool result is the sum of every worker model turn.\n- [x] An `agent_run` call with an unknown option name fails the type check before any worker starts.\n"}, {"path": "tickets/03-extension-tools-fetch-skills.md", "bytes": 1196, "source": "# 03: Extension tools, fetch, and skills from Python\n\n**What to build:** Python programs can call every captured extension tool (including the MCP gateway) as a type-checked function named after the tool. `tools_list`, `tools_search`, `tools_describe`, and `tools_call` give dynamic discovery. Interactive subagent tools and root-only tools stay excluded. `fetch(url, method=, headers=, body=)` returns status, headers, and text or bytes. It shares the call budget, concurrency, deadline, abort, and trace (header values and request bodies are left out of trace summaries). `skills_list` and `skills_body` return model-invocable skills. The exec documentation covers this surface.\n\n**Blocked by:** 01: Python programs run on Monty with the core tools.\n\n**Status:** done\n\n- [x] A Python program calls the `mcp` gateway and returns its result text.\n- [x] Calling an interactive subagent tool or a root-only tool by name fails the type check.\n- [x] `fetch` against a local test server returns status, headers, and body. An abort while it is in flight ends the program as cancelled.\n- [x] `skills_body` returns a packaged skill body without frontmatter, and fails for an unknown or human-only skill.\n"}, {"path": "tickets/04-evidence-library-and-skill-programs.md", "bytes": 1448, "source": "# 04: Evidence library in Python, and the review and Ralph programs rewritten\n\n**What to build:** The deliberately small evidence library is available to Python as host functions: git change and patch, change-neighborhood evidence, the required/clippable/droppable context marks with fit and pack, strict schema shorthand if 02 did not cover it, and relevant-test discovery and bounded execution. The coverage and reconcile helpers are removed, because Python sets and dicts express them directly. Marked contexts passed to `agent_run` are fitted automatically, as today. The code-review and Ralph reference programs are rewritten in Python against the live signatures, and their skill instructions describe the Python programs. The exec documentation's library section is updated.\n\n**Blocked by:** 02: Model workers from Python.\n\n**Status:** done\n\n- [x] `git_change` on a dirty checkout returns the changed paths, the patch, and line totals that match `git diff`.\n- [x] A marked `agent_run` context that is larger than the channel budget is fitted, and `context.truncated` lists the clipped paths.\n- [x] `dev_run_relevant_tests` with no discovered tests returns `not_run` with a reason.\n- [x] Every rewritten code-review and Ralph reference program passes the type check against the live signatures.\n- [x] A multi-lens review run on a small real diff returns findings with evidence.\n- [x] The guest contract has no coverage or reconcile function.\n"}, {"path": "tickets/05-saved-python-programs.md", "bytes": 1285, "source": "# 05: Saved Python programs become typed tools\n\n**What to build:** A saved project program is a Python file in the project programs directory. Its leading docstring gives a one-line description and `@param` tags that declare typed, optional, defaulted parameters. Each file appears as a `program_<name>` tool with a synthesized parameter schema, and its arguments reach the program as `inputs`. The current rules stay: sync only at cache-safe boundaries, project trust required, re-read from disk on each call, name and path confinement, and reject a malformed description. JavaScript program files are no longer discovered. The saved-programs documentation and prompt guidance describe the Python format.\n\n**Blocked by:** 01: Python programs run on Monty with the core tools.\n\n**Status:** done\n\n- [x] A trusted project with a Python program that declares a `@param` exposes `program_<name>` with that typed parameter at session start, and calling it returns the program result that uses the argument.\n- [x] A `.js` file in the programs directory is not listed as a tool.\n- [x] An untrusted project cannot run a saved program.\n- [x] Editing a program in the middle of a turn changes its behavior on the next call but not the registered tool schema, until the next cache-safe boundary.\n"}, {"path": "tickets/06-branch-aligned-live-session.md", "bytes": 1863, "source": "# 06: A live session that follows the session tree, with reset and recovery\n\n**What to build:** Each root Pi session has one live Monty session, so variables and functions persist across `pi_exec` calls. After every call that leaves the Monty session usable (success or an ordinary Python exception), its dump is saved as a Pi session entry. Monty's own dump size limit is the only size bound. When a session starts, reloads, forks, or moves to another point with `/tree`, the live session is rebuilt from the dump nearest to the current branch leaf. A `reset: true` tool parameter starts an empty session. A terminal failure (memory or time limit, worker crash) throws away the live session. The next call restores the last saved dump, and the failed call's result states that the state was rolled back. A dump that cannot be loaded (for example, after a Monty version change) gives an empty session with a notice. The tree and `reset` are the only restore points; there are no named save points. The `state` parameter and snapshot store are removed. The exec documentation, the boundaries entry that rejected persistent kernels, and the execution-context description in the agent guide are updated.\n\n**Blocked by:** 01: Python programs run on Monty with the core tools.\n\n**Status:** done\n\n- [x] `x = 1` in one call, then `x + 1` in the next call, returns 2, and still returns 2 after an extension reload.\n- [x] After `/tree` navigation back to a point before `x = 2` was assigned, `x` has its value from that point.\n- [x] A call with `reset: true` makes `x` a `NameError`.\n- [x] A call that exceeds the memory limit reports the rollback, and the next call still sees the `x` from before the failed call.\n- [x] A stored dump that cannot be loaded gives an empty session and a notice, not a failed call.\n- [x] The `state` parameter no longer exists on `pi_exec`.\n"}]}};
const MID = { bench: { 2: "done", 1: "in-progress" }, monty: { 1: "done", 3: "done", 2: "in-progress", 6: "in-progress" } };
const BROKEN = { bench: [2, "**Blocked by:** 04: First benchmark run; 07: Report template."], monty: [3, "**Blocked by:** 05: Saved Python programs become typed tools; 09: Tool catalog."] };
const params = new URLSearchParams(location.search);
const state = {
