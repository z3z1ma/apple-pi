<!doctype html>
<!-- PROTOTYPE 2: the notch pill expands into one pixel room per tmux session. Opened alone in a browser it uses mock agents. -->
<html>
<head>
<meta charset="utf-8">
<style>
	:root {
		--waiting: #fae3b0; --done: #abe9b3; --working: #f5c2e7; --quiet: #7f849c;
		--ease: cubic-bezier(.32, .72, 0, 1);
	}
	html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
		font: 12px/1.3 -apple-system, BlinkMacSystemFont, sans-serif; color: #cdd6f4; user-select: none; cursor: default; }
	body.browser { background: linear-gradient(#3b4252 0 32px, #1e1e2e 32px); }
	#island {
		position: absolute; top: 0; left: 50%; transform: translateX(-50%);
		background: #000; border-radius: 0 0 14px 14px; overflow: hidden;
		transition: width .35s var(--ease), height .35s var(--ease), border-radius .35s var(--ease);
	}
	#island.open { border-radius: 0 0 22px 22px; }
	#bar { display: flex; align-items: center; justify-content: space-between; padding: 0 14px; height: var(--notch-height); }
	.wing { display: flex; align-items: center; gap: 5px; }
	.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
	.dot.working { animation: pulse 1.6s ease-in-out infinite; }
	@keyframes pulse { 50% { opacity: .35; } }
	.count { color: var(--quiet); font-weight: 600; font-size: 11px; }
	#rooms { display: flex; gap: 12px; justify-content: center; padding: 6px 14px 14px; width: max-content;
		opacity: 0; transition: opacity .2s; }
	#island.open #rooms { opacity: 1; transition-delay: .12s; }
	.room { position: relative; }
	.room canvas { display: block; image-rendering: pixelated; border-radius: 8px; }
	.plaque { position: absolute; left: 8px; top: 6px; padding: 1px 7px; border-radius: 6px;
		background: #000a; font-size: 11px; font-weight: 600; color: #f9e2af; }
	.tip { position: absolute; pointer-events: none; transform: translate(-50%, -100%); padding: 5px 8px;
		border-radius: 8px; background: #11111bee; border: 1px solid #313244; white-space: nowrap;
		max-width: 300px; overflow: hidden; text-overflow: ellipsis; }
	.tip .state { color: var(--c); font-size: 11px; }
	.tip .what { color: var(--quiet); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
	.empty { padding: 10px 40px; color: var(--quiet); }
</style>
</head>
<body>
<div id="island"><div id="bar"><div class="wing" id="left"></div><div class="wing" id="right"></div></div><div id="rooms"></div></div>
<script>
const shell = window.webkit?.messageHandlers?.notch;
const geo = window.notchGeometry ?? { notchWidth: 185, notchHeight: 32, width: 1100, height: 500 };
const island = document.getElementById("island");
const bar = document.getElementById("bar");
const roomsEl = document.getElementById("rooms");
const label = { waiting: "needs you", done: "done", working: "working", quiet: "quiet" };
const order = { waiting: 0, done: 1, working: 2, quiet: 3 };
const STATES = Object.keys(order);
const VARIANTS = 6; // one per HOODIE_HUES entry in assets/clean.py
// Room art is 250×140 art pixels (the room.png that assets/clean.py writes); agents stand on the floor between these x bounds, in two staggered rows.
const ART = { w: 250, h: 140, floorLeft: 62, floorRight: 222, backRow: 116, frontRow: 130 };
document.documentElement.style.setProperty("--notch-height", `${geo.notchHeight}px`);

const load = (src) => new Promise((done) => { const img = new Image(); img.onload = () => done(img); img.src = src; });
const sprites = {};
let roomArt;
let agents = [];
let open = false;
let tick = 0;

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => `&#${c.charCodeAt(0)};`);
const variantOf = (id) => [...String(id)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7) % VARIANTS;

function renderPill() {
	const sorted = [...agents].sort((a, b) => order[a.state] - order[b.state]);
	document.getElementById("left").innerHTML =
		`<span class="count">π ${agents.length}</span>` +
		sorted.filter((a) => a.state === "waiting" || a.state === "done")
			.map((a) => `<span class="dot" style="--c:var(--${a.state})"></span>`).join("");
	document.getElementById("right").innerHTML = sorted
		.filter((a) => a.state === "working" || a.state === "quiet")
		.map((a) => `<span class="dot ${a.state}" style="--c:var(--${a.state})"></span>`).join("");
}

function sessions() {
	const groups = new Map();
	for (const agent of agents) {
		const key = agent.tmuxSession || "tmux";
		if (!groups.has(key)) groups.set(key, []);
		groups.get(key).push(agent);
	}
	return [...groups].sort((a, b) => b[1].length - a[1].length);
}

// Largest scale whose device pixels stay whole (on a 2× display) and whose rooms fit the panel.
function roomScale(count) {
	const room = (s) => count * (ART.w * s + 12) + 28;
	return [2, 1.5, 1].find((s) => room(s) <= geo.width) ?? 1;
}

function place(group) {
	const step = (ART.floorRight - ART.floorLeft) / group.length;
	return group.map((agent, i) => ({
		agent,
		x: ART.floorLeft + (i + 0.5) * step,
		y: i % 2 ? ART.backRow : ART.frontRow,
	}));
}

function bob(state, i) {
	const t = tick + i;
	if (state === "working") return t % 2 ? 0 : 1;
	if (state === "waiting") return Math.floor(t / 2) % 2 ? -2 : 0;
	if (state === "done") return t % 4 === 0 ? -3 : 0;
	return 0;
}

function renderRooms() {
	const groups = sessions();
	if (!groups.length) {
		roomsEl.innerHTML = `<div class="empty">No pi agents in tmux</div>`;
		delete roomsEl.dataset.signature;
		return;
	}
	const scale = roomScale(groups.length);
	const dpr = window.devicePixelRatio || 1;
	// Same sessions and agents: redraw in place, so an open tooltip survives the once-a-second feed.
	const signature = JSON.stringify(groups.map(([name, group]) => [name, group.map((a) => a.id)]));
	if (signature === roomsEl.dataset.signature) {
		const byId = new Map(agents.map((a) => [a.id, a]));
		for (const room of roomsEl.querySelectorAll(".room")) {
			for (const p of room.placed) p.agent = byId.get(p.agent.id);
		}
		return redrawRooms();
	}
	roomsEl.dataset.signature = signature;
	roomsEl.innerHTML = "";
	for (const [name, group] of groups) {
		const room = document.createElement("div");
		room.className = "room";
		const canvas = document.createElement("canvas");
		canvas.width = ART.w * scale * dpr;
		canvas.height = ART.h * scale * dpr;
		canvas.style.width = `${ART.w * scale}px`;
		canvas.style.height = `${ART.h * scale}px`;
		room.append(canvas);
		room.insertAdjacentHTML("beforeend", `<span class="plaque">${esc(name)}</span>`);
		roomsEl.append(room);
		room.placed = place(group);
		room.scale = scale;
		drawRoom(room);
		canvas.onmousemove = (event) => hoverAgent(room, event);
		canvas.onmouseleave = () => room.querySelector(".tip")?.remove();
		canvas.onclick = (event) => {
			const hit = hitTest(room, event);
			if (hit) focusAgent(hit.agent);
		};
	}
}

function drawRoom(room) {
	const ctx = room.querySelector("canvas").getContext("2d");
	const pixel = room.scale * (window.devicePixelRatio || 1);
	ctx.imageSmoothingEnabled = false;
	ctx.setTransform(pixel, 0, 0, pixel, 0, 0);
	ctx.drawImage(roomArt, 0, 0);
	[...room.placed].sort((a, b) => a.y - b.y).forEach((p, i) => {
		const img = sprites[`${p.agent.state}-${variantOf(p.agent.id)}`];
		p.box = { x: Math.round(p.x - img.width / 2), y: p.y - img.height, w: img.width, h: img.height };
		ctx.drawImage(img, p.box.x, p.box.y + bob(p.agent.state, i));
	});
}

const redrawRooms = () => roomsEl.querySelectorAll(".room").forEach(drawRoom);

function hitTest(room, event) {
	const rect = event.target.getBoundingClientRect();
	const x = (event.clientX - rect.left) / room.scale;
	const y = (event.clientY - rect.top) / room.scale;
	// Front row wins: test in reverse draw order.
	return [...room.placed].sort((a, b) => b.y - a.y)
		.find((p) => p.box && x >= p.box.x && x < p.box.x + p.box.w && y >= p.box.y && y < p.box.y + p.box.h);
}

function hoverAgent(room, event) {
	const hit = hitTest(room, event);
	event.target.style.cursor = hit ? "pointer" : "default";
	let tip = room.querySelector(".tip");
	if (!hit) return tip?.remove();
	if (!tip) room.append((tip = Object.assign(document.createElement("div"), { className: "tip" })));
	const a = hit.agent;
	tip.style.setProperty("--c", `var(--${a.state})`);
	tip.style.left = `${(hit.box.x + hit.box.w / 2) * room.scale}px`;
	tip.style.top = `${hit.box.y * room.scale - 4}px`;
	tip.innerHTML = `<b>${esc(a.name)}</b> <span class="state">${label[a.state]}</span>` +
		`<div class="what">${esc(a.project)}${a.tool ? ` · ${esc(a.tool)} ${esc(a.detail)}` : ""}</div>`;
}

function render() {
	renderPill();
	renderRooms();
	layout();
}

function layout() {
	const wing = Math.max(...[...bar.querySelectorAll(".wing")].map((w) => w.scrollWidth), 24) + 14;
	const closedWidth = geo.notchWidth + 2 * wing;
	const width = open ? Math.max(roomsEl.scrollWidth, closedWidth) : closedWidth;
	const height = open ? geo.notchHeight + roomsEl.scrollHeight : geo.notchHeight;
	island.style.width = `${width}px`;
	island.style.height = `${height}px`;
	island.classList.toggle("open", open);
	// Report the final shape at once, so the pointer is not judged outside while the expansion animates.
	shell?.postMessage({ type: "hit", x: (geo.width - width) / 2, y: 0, w: width, h: height });
}

function focusAgent(agent) {
	if (shell) shell.postMessage({ type: "focus", paneId: agent.paneId, tmuxSession: agent.tmuxSession });
	else console.log("focus", agent.paneId);
}

// Pixel animation runs at 4 fps, and only while the rooms are visible.
setInterval(() => {
	if (!open || !roomArt) return;
	tick++;
	redrawRooms();
}, 250);

window.notch = {
	update(next) { agents = next; if (roomArt) render(); },
	hover(inside) { if (inside !== open) { open = inside; layout(); } },
};

Promise.all([
	load("assets/room.png").then((img) => { roomArt = img; }),
	...STATES.flatMap((state) => Array.from({ length: VARIANTS }, (_, v) =>
		load(`assets/agent-${state}-${v}.png`).then((img) => { sprites[`${state}-${v}`] = img; }))),
]).then(() => {
	if (shell) return render();
	document.body.classList.add("browser");
	island.onmouseenter = () => window.notch.hover(true);
	island.onmouseleave = () => window.notch.hover(false);
	const mock = [
		["Pixel Notch Agent Room", "apple-pi", "bash", "swiftc -O NotchShell.swift", "CodingHarness"],
		["Prune Low-Value Vitest Tests", "apple-pi", "edit", "tests/package-load.mjs", "CodingHarness"],
		["Session title follow-up", "apple-pi", "read", "components/session-title", "CodingHarness"],
		["Code context evaluation", "apple-pi", "pi_exec", "replay task 3", "CodingHarness"],
		["Grafana latency triage", "checkout", "mcp__grafana", "query p99", "WORK"],
		["Release notes", "website", "read", "CHANGELOG.md", "WORK"],
	].map(([name, project, tool, detail, tmuxSession], i) =>
		({ id: `mock-${i}`, name, project, tool, detail, tmuxSession, state: STATES[i % 4], paneId: `%${i}` }));
	window.notch.update(mock);
	setInterval(() => {
		const a = mock[Math.floor(Math.random() * mock.length)];
		a.state = STATES[(STATES.indexOf(a.state) + 1) % STATES.length];
		window.notch.update(mock);
	}, 3000);
});
</script>
</body>
</html>
