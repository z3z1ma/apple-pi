<!doctype html>
<!-- The notch pill expands into the pixel room of one tmux session; arrows cycle sessions, a toggle switches vibe.
     Opened alone in a browser it uses mock agents. Assets and their names come from assets/manifest.js (written by ../art/clean.py). -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
	:root {
		--waiting: #fae3b0; --done: #abe9b3; --working: #f5c2e7; --quiet: #7f849c;
		--ease: cubic-bezier(.32, .72, 0, 1);
	}
	html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
		font: 12px/1.3 -apple-system, BlinkMacSystemFont, sans-serif; color: #cdd6f4; user-select: none; cursor: default; }
	body.browser { background: linear-gradient(#3b4252 0 32px, #1e1e2e 32px); }
	#island {
		position: absolute; top: 0; left: 50%; transform: translateX(-50%);
		background: #000; border-radius: 0 0 14px 14px; overflow: hidden;
		transition: width .35s var(--ease), height .35s var(--ease), border-radius .35s var(--ease);
	}
	#island.open { border-radius: 0 0 22px 22px; }
	#bar { display: flex; align-items: center; justify-content: space-between; padding: 0 14px; height: var(--notch-height); }
	.wing { display: flex; align-items: center; gap: 5px; }
	.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
	.dot.working { animation: pulse 1.6s ease-in-out infinite; }
	@keyframes pulse { 50% { opacity: .35; } }
	.count { color: var(--quiet); font-weight: 600; font-size: 11px; }
	#stage { position: relative; width: max-content; margin: 6px 14px 14px; opacity: 0; transition: opacity .2s; }
	#island.open #stage { opacity: 1; transition-delay: .12s; }
	canvas { display: block; image-rendering: pixelated; border-radius: 8px; }
	.chip { padding: 2px 8px; border-radius: 7px; background: #000b; color: #cdd6f4; border: 0; font: inherit; font-size: 11px; font-weight: 600; }
	#plaque { position: absolute; left: 8px; top: 6px; color: #f9e2af; }
	#plaque .of { color: var(--quiet); font-weight: 500; margin-left: 4px; }
	#controls { position: absolute; right: 8px; top: 6px; display: flex; gap: 6px; }
	.arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 26px; height: 40px; border: 0; border-radius: 8px;
		background: #000a; color: #f9e2af; font-size: 20px; line-height: 40px; padding: 0; }
	#prev { left: 6px; } #next { right: 6px; }
	.tip { position: absolute; pointer-events: none; transform: translate(-50%, -100%); padding: 5px 8px;
		border-radius: 8px; background: #11111bee; border: 1px solid #313244; white-space: nowrap;
		max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
	.tip .state { color: var(--c); font-size: 11px; }
	.tip .what { color: var(--quiet); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
</style>
<script src="assets/manifest.js"></script>
</head>
<body>
<div id="island">
	<div id="bar"><div class="wing" id="left"></div><div class="wing" id="right"></div></div>
	<div id="stage">
		<canvas></canvas>
		<span class="chip" id="plaque"></span>
		<div id="controls"><button type="button" class="chip" id="shuffle" title="Shuffle room and workers">🎲</button><button type="button" class="chip" id="vibe"></button></div>
		<button type="button" class="arrow" id="prev">‹</button><button type="button" class="arrow" id="next">›</button>
	</div>
</div>
<script>
const shell = window.webkit?.messageHandlers?.notch;
const geo = window.notchGeometry ?? { notchWidth: 185, notchHeight: 32, width: 1100, height: 500 };
const { states: STATES, variants: VARIANTS, room: ART, vibes: VIBES } = window.ASSETS;
const $ = (id) => document.getElementById(id);
const island = $("island"), bar = $("bar"), stage = $("stage"), canvas = stage.querySelector("canvas");
const label = { waiting: "needs you", done: "done", working: "working", quiet: "quiet" };
const order = { waiting: 0, done: 1, working: 2, quiet: 3 };
const vibeLabel = { office: "☕ Office", cozy: "🌙 Cozy" };
const DEFAULT_VIBE = "office";
// Css pixels per pixel, in steps that stay whole device pixels on a 2× display. Workers keep SPRITE; the room
// starts at SPRITE and grows when its workers would stand closer than CROWDING of a worker's width apart.
const SPRITE = 2.5;
const SCALE_STEP = 0.5;
const CROWDING = 0.8;
// Workers stand on the floor between these x bounds, in two staggered rows; fractions of the room size.
const FLOOR = { left: 0.14, right: 0.86, backRow: 0.84, frontRow: 0.95 };
const STATE_COLOR = { waiting: "#fae3b0", done: "#abe9b3", working: "#f5c2e7", quiet: "#9399b2" };
const INK = "#1e1e2e";
// 5×5 glyphs drawn inside each worker's state bubble.
const GLYPH = {
	waiting: ["..#..", "..#..", "..#..", ".....", "..#.."],
	done: [".....", "....#", "...#.", "#.#..", ".#..."],
	quiet: ["#####", "...#.", "..#..", ".#...", "#####"],
	working: [".....", ".....", ".....", "#.#.#", "....."],
};
// The largest room scale that still fits the shell's window.
const MAX_SCALE = Math.floor(Math.min((geo.width - 28) / ART.w, (geo.height - geo.notchHeight - 20) / ART.h) / SCALE_STEP) * SCALE_STEP;
document.documentElement.style.setProperty("--notch-height", `${geo.notchHeight}px`);

const images = {};
// Choices per tmux session: its vibe; the room and worker look the shuffle button picked, by `${vibe}/${session}`;
// and where you dragged its workers, as fractions of the room size. The shell loads them from and saves them to
// <pi home>/state/notch.json, so other front ends can read them; opened alone in a browser they live in memory.
const choices = { vibes: {}, rooms: {}, looks: {}, positions: {}, ...window.notchState };
const { vibes: chosenVibes, rooms: chosenRooms, looks: chosenLooks, positions } = choices;
const save = () => shell?.postMessage({ type: "save", state: choices });
let agents = [];
let session = null;
let scale = SPRITE;
let placed = [];
let open = false;
let tick = 0;
let pointer = null;
let drag = null;

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => `&#${c.charCodeAt(0)};`);
const hash = (s, seed) => [...String(s)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, seed);
const half = (v) => Math.round(v * 2) / 2;
const vibeOf = (name) => (VIBES[chosenVibes[name]] ? chosenVibes[name] : DEFAULT_VIBE);
const roomOf = (name) => {
	const vibe = vibeOf(name);
	const rooms = VIBES[vibe].rooms;
	const chosen = chosenRooms[`${vibe}/${name}`];
	return rooms.includes(chosen) ? chosen : rooms[hash(name, 7) % rooms.length];
};
const spriteOf = (agent, name) => {
	const vibe = vibeOf(name);
	const look = chosenLooks[`${vibe}/${name}`] ?? 0;
	const workers = VIBES[vibe].workers;
	const worker = workers[hash(agent.id, 3 + look) % workers.length];
	return images[`${vibe}/${worker}-${agent.state}-${hash(agent.id, 11 + look) % VARIANTS}`];
};

function sessions() {
	const groups = new Map();
	for (const agent of agents) {
		const key = agent.tmuxSession || "tmux";
		if (!groups.has(key)) groups.set(key, []);
		groups.get(key).push(agent);
	}
	return [...groups].sort(([a], [b]) => a.localeCompare(b));
}

function renderPill() {
	const sorted = [...agents].sort((a, b) => order[a.state] - order[b.state]);
	$("left").innerHTML = `<span class="count">π ${agents.length}</span>` +
		sorted.filter((a) => a.state === "waiting" || a.state === "done")
			.map((a) => `<span class="dot" style="--c:var(--${a.state})"></span>`).join("");
	$("right").innerHTML = sorted.filter((a) => a.state === "working" || a.state === "quiet")
		.map((a) => `<span class="dot ${a.state}" style="--c:var(--${a.state})"></span>`).join("");
}

function roomScale(group, name) {
	const widest = Math.max(...group.map((agent) => spriteOf(agent, name).width)) * SPRITE;
	const needed = (group.length * widest * CROWDING) / ((FLOOR.right - FLOOR.left) * ART.w);
	return Math.max(SPRITE, Math.min(MAX_SCALE, Math.ceil(needed / SCALE_STEP) * SCALE_STEP));
}

function renderStage() {
	const groups = sessions();
	stage.hidden = !groups.length;
	if (!groups.length) return;
	const names = groups.map(([name]) => name);
	if (!names.includes(session)) session = names[0];
	const group = groups.find(([name]) => name === session)[1];
	const vibe = vibeOf(session);
	// One scale for every session, from the most crowded room, so the panel and its arrows stay put while you cycle.
	scale = Math.max(...groups.map(([name, members]) => roomScale(members, name)));
	if (canvas.width !== ART.w * scale * devicePixelRatio) {
		canvas.width = ART.w * scale * devicePixelRatio;
		canvas.height = ART.h * scale * devicePixelRatio;
		canvas.style.width = `${ART.w * scale}px`;
		canvas.style.height = `${ART.h * scale}px`;
	}
	const step = (FLOOR.right - FLOOR.left) / group.length;
	placed = group.map((agent, i) => {
		const [fx, fy] = positions[session]?.[agent.id] ?? [FLOOR.left + (i + 0.5) * step, i % 2 ? FLOOR.backRow : FLOOR.frontRow];
		return { agent, x: fx * ART.w * scale, y: half(fy * ART.h * scale) };
	});
	$("plaque").innerHTML = `${esc(session)}<span class="of">${names.indexOf(session) + 1}/${names.length}</span>`;
	$("vibe").textContent = vibeLabel[vibe] ?? vibe;
	$("prev").hidden = $("next").hidden = names.length < 2;
	draw();
}

function bob(state, i) {
	const t = tick + i;
	if (state === "working") return t % 2 ? 0 : 1;
	if (state === "waiting") return Math.floor(t / 2) % 2 ? -2 : 0;
	if (state === "done") return t % 4 === 0 ? -3 : 0;
	return 0;
}

// The bubble is drawn in sprite pixels, so it matches the workers at any room scale.
function bubble(ctx, state, cx, bottom) {
	const x0 = half(cx - 4.5 * SPRITE), y0 = bottom - 11 * SPRITE;
	const px = (x, y, w, h) => ctx.fillRect(x0 + x * SPRITE, y0 + y * SPRITE, w * SPRITE, h * SPRITE);
	ctx.fillStyle = INK;
	px(1, 0, 7, 9); px(0, 1, 9, 7); px(3, 9, 3, 1); px(4, 10, 1, 1);
	ctx.fillStyle = STATE_COLOR[state];
	px(1, 1, 7, 7); px(4, 8, 1, 2);
	ctx.fillStyle = INK;
	const dots = state === "working" ? 1 + (tick % 3) : 5;
	GLYPH[state].forEach((row, gy) => {
		[...row].forEach((c, gx) => {
			if (c === "#" && (state !== "working" || gx / 2 < dots)) px(2 + gx, 2 + gy, 1, 1);
		});
	});
}

function draw() {
	const ctx = canvas.getContext("2d");
	const vibe = vibeOf(session);
	ctx.imageSmoothingEnabled = false;
	ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
	ctx.drawImage(images[`${vibe}/room-${roomOf(session)}`], 0, 0, ART.w * scale, ART.h * scale);
	[...placed].sort((a, b) => a.y - b.y).forEach((p, i) => {
		const img = spriteOf(p.agent, session);
		const w = img.width * SPRITE, h = img.height * SPRITE;
		const lift = bob(p.agent.state, i) * SPRITE;
		p.box = { x: half(p.x - w / 2), y: p.y - h, w, h };
		ctx.drawImage(img, p.box.x, p.box.y + lift, w, h);
		bubble(ctx, p.agent.state, p.x, p.box.y + lift);
	});
	showTip();
}

function hitTest(clientX, clientY) {
	const rect = canvas.getBoundingClientRect();
	const x = clientX - rect.left, y = clientY - rect.top;
	// Front row wins: test in reverse draw order. The bubble above the head counts as part of the worker.
	return [...placed].sort((a, b) => b.y - a.y).find((p) =>
		p.box && x >= p.box.x && x < p.box.x + p.box.w && y >= p.box.y - 12 * SPRITE && y < p.box.y + p.box.h);
}

// The shell forwards the pointer, because a panel that never becomes key gets no mouse-move events in its web view.
function pointAt(clientX, clientY) {
	pointer = { x: clientX, y: clientY };
	if (drag) moveDrag(clientX, clientY);
	else showTip();
}

function showTip() {
	const hit = open && pointer && !drag ? hitTest(pointer.x, pointer.y) : null;
	let tip = stage.querySelector(".tip");
	if (!hit) return tip?.remove();
	if (!tip) {
		tip = Object.assign(document.createElement("div"), { className: "tip" });
		stage.append(tip);
	}
	const a = hit.agent;
	tip.style.setProperty("--c", `var(--${a.state})`);
	tip.style.left = `${hit.box.x + hit.box.w / 2}px`;
	tip.style.top = `${hit.box.y - 12 * SPRITE - 4}px`;
	tip.innerHTML = `<b>${esc(a.name)}</b> <span class="state">${label[a.state]}</span>` +
		`<div class="what">${esc(a.project)}${a.tool ? ` · ${esc(a.tool)} ${esc(a.detail)}` : ""}</div>`;
}

function cycle(delta) {
	const names = sessions().map(([name]) => name);
	session = names[(names.indexOf(session) + delta + names.length) % names.length];
	render();
}

function render() {
	renderPill();
	renderStage();
	layout();
}

function layout() {
	const wing = Math.max(...[...bar.querySelectorAll(".wing")].map((w) => w.scrollWidth), 24) + 14;
	const closedWidth = geo.notchWidth + 2 * wing;
	const openWidth = stage.hidden ? closedWidth : ART.w * scale + 28;
	const width = open ? Math.max(openWidth, closedWidth) : closedWidth;
	const height = open ? geo.notchHeight + (stage.hidden ? 0 : ART.h * scale + 20) : geo.notchHeight;
	island.style.width = `${width}px`;
	island.style.height = `${height}px`;
	island.classList.toggle("open", open);
	// Report the final shape at once, so the pointer is not judged outside while the expansion animates.
	shell?.postMessage({ type: "hit", x: (geo.width - width) / 2, y: 0, w: width, h: height });
}

function focusAgent(agent) {
	if (shell) {
		shell.postMessage({
			type: "focus",
			paneId: agent.paneId,
			tmuxSession: agent.tmuxSession,
			tmuxSocket: agent.tmuxSocket,
		});
	} else {
		console.log("focus", agent.paneId);
	}
}

// Pressing a worker and moving more than 3 px drags its bottom-centre anchor, kept inside the room; releasing
// without moving focuses its pane.
function moveDrag(clientX, clientY) {
	drag.moved ||= Math.hypot(clientX - drag.startX, clientY - drag.startY) > 3;
	if (!drag.moved) return;
	const rect = canvas.getBoundingClientRect();
	const w = ART.w * scale, h = ART.h * scale;
	const x = Math.min(Math.max(clientX - rect.left - drag.dx, drag.w / 2), w - drag.w / 2);
	const y = Math.min(Math.max(clientY - rect.top - drag.dy, drag.h), h);
	positions[session] ??= {};
	positions[session][drag.agent.id] = [x / w, y / h];
	renderStage();
}

canvas.onmousedown = (event) => {
	const hit = hitTest(event.clientX, event.clientY);
	if (!hit) return;
	event.preventDefault();
	const rect = canvas.getBoundingClientRect();
	drag = {
		agent: hit.agent, w: hit.box.w, h: hit.box.h, moved: false, startX: event.clientX, startY: event.clientY,
		dx: event.clientX - rect.left - hit.x, dy: event.clientY - rect.top - hit.y,
	};
};
window.addEventListener("mousemove", (event) => pointAt(event.clientX, event.clientY));
window.addEventListener("mouseup", () => {
	if (drag?.moved) save();
	else if (drag) focusAgent(drag.agent);
	drag = null;
});
$("prev").onclick = () => cycle(-1);
$("next").onclick = () => cycle(1);
$("shuffle").onclick = () => {
	const vibe = vibeOf(session);
	const current = roomOf(session);
	const others = VIBES[vibe].rooms.filter((room) => room !== current);
	if (!others.length) return;
	chosenRooms[`${vibe}/${session}`] = others[Math.floor(Math.random() * others.length)];
	chosenLooks[`${vibe}/${session}`] = Math.floor(Math.random() * 2 ** 31);
	save();
	render();
};
$("vibe").onclick = () => {
	const names = Object.keys(VIBES);
	chosenVibes[session] = names[(names.indexOf(vibeOf(session)) + 1) % names.length];
	save();
	render();
};

// Pixel animation runs at 4 fps, and only while the room is visible.
setInterval(() => {
	if (!open || stage.hidden) return;
	tick++;
	draw();
}, 250);

window.notch = {
	update(next) { agents = next; render(); },
	hover(inside) {
		if (inside === open) return;
		open = inside;
		// Opening shows the session whose agent has waited longest for you, if any.
		const waiting = agents.filter((a) => a.state === "waiting").sort((a, b) => a.updatedAt - b.updatedAt)[0];
		if (open && waiting) session = waiting.tmuxSession || "tmux";
		if (!open) {
			// A drag cut short by leaving the panel keeps the spot it reached.
			if (drag?.moved) save();
			pointer = drag = null;
		}
		render();
	},
	pointer: pointAt,
};

const load = (key) => new Promise((done) => {
	const img = new Image();
	img.onload = () => {
		images[key] = img;
		done(img);
	};
	img.src = `assets/${key}.png`;
});
Promise.all(Object.entries(VIBES).flatMap(([name, { rooms, workers }]) => [
	...rooms.map((room) => load(`${name}/room-${room}`)),
	...workers.flatMap((w) => STATES.flatMap((s) => Array.from({ length: VARIANTS }, (_, v) => load(`${name}/${w}-${s}-${v}`)))),
])).then(() => {
	if (shell) return render();
	document.body.classList.add("browser");
	island.onmouseenter = () => window.notch.hover(true);
	island.onmouseleave = () => window.notch.hover(false);
	const mock = [
		["Pixel Notch Agent Room", "apple-pi", "bash", "swiftc -O NotchShell.swift", "CodingHarness"],
		["Prune Low-Value Vitest Tests", "apple-pi", "edit", "tests/package-load.mjs", "CodingHarness"],
		["Session title follow-up", "apple-pi", "read", "components/session-title", "CodingHarness"],
		["Code context evaluation", "apple-pi", "pi_exec", "replay task 3", "CodingHarness"],
		["Ledger history replay", "apple-pi", "grep", "history.json", "CodingHarness"],
		["Work panel layout", "apple-pi", "edit", "components/shared/src/work-panel.ts", "CodingHarness"],
		["Grafana latency triage", "checkout", "mcp__grafana", "query p99", "WORK"],
		["Release notes", "website", "read", "CHANGELOG.md", "WORK"],
	].map(([name, project, tool, detail, tmuxSession], i) =>
		({ id: `mock-${i}`, name, project, tool, detail, tmuxSession, state: STATES[i % 4], paneId: `%${i}`, updatedAt: i }));
	window.notch.update(mock);
	setInterval(() => {
		const a = mock[Math.floor(Math.random() * mock.length)];
		a.state = STATES[(STATES.indexOf(a.state) + 1) % STATES.length];
		window.notch.update(mock);
	}, 3000);
});
</script>
</body>
</html>
